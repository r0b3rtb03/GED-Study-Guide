<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>Practice — GED Study Guide</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/theme.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  @media (max-width: 540px) {
    .topic-grid { grid-template-columns: 1fr !important; }
    .topic-grid-fifth { width: 100% !important; }
  }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen">
  <!-- Sticky session bar — visible only during an active session -->
  <header id="sessionBar" class="hidden fixed top-0 right-0 left-0 md:left-64 z-40 md:z-20 bg-surface-container-lowest border-b border-outline-variant">
    <div class="max-w-2xl mx-auto h-14 px-4 md:px-6 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <span id="topicBadge" class="inline-flex items-center gap-1 px-3 h-8 rounded-full bg-primary-container/10 text-primary text-label-md font-bold whitespace-nowrap"></span>
        <span id="timer" class="text-label-md text-on-surface-variant tabular-nums">0:00</span>
      </div>
      <div id="difficultyGroup" class="hidden sm:inline-flex rounded-full bg-surface-container p-1 text-label-md">
        <button data-diff="easy"   class="h-7 px-3 rounded-full">Easy</button>
        <button data-diff="medium" class="h-7 px-3 rounded-full">Medium</button>
        <button data-diff="hard"   class="h-7 px-3 rounded-full">Hard</button>
      </div>
      <p id="qCounter" class="text-label-md text-on-surface-variant whitespace-nowrap">Question 1 of 10</p>
    </div>
  </header>

  <main class="md:pl-64 pt-16 md:pt-0 pb-20 md:pb-0">
    <!-- Pre-session topic chooser -->
    <section id="chooser"
             class="hidden flex flex-col items-center justify-center px-4 md:px-8 py-8"
             style="min-height: calc(100vh - 64px);">
      <div class="w-full max-w-[720px] mx-auto">
        <div class="text-center mb-6">
          <h1 class="text-headline-lg font-headline-lg">Start a Practice Session</h1>
          <p class="text-body-md text-on-surface-variant mt-2">Choose a subject, then a difficulty, then a topic — we'll generate 10 GED-style questions.</p>
        </div>

        <!-- Step 1: Subject -->
        <p class="text-center text-label-md font-bold text-on-surface-variant mb-3">
          <span class="inline-flex items-center gap-1.5">
            <span class="w-5 h-5 rounded-full bg-primary text-on-primary text-[12px] flex items-center justify-center font-bold">1</span>
            Pick a subject
          </span>
        </p>
        <div id="subjectGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8"></div>

        <!-- Step 2: Difficulty -->
        <p id="difficultyStepLabel" class="text-center text-label-md font-bold text-on-surface-variant mb-3 hidden">
          <span class="inline-flex items-center gap-1.5">
            <span class="w-5 h-5 rounded-full bg-primary text-on-primary text-[12px] flex items-center justify-center font-bold">2</span>
            Choose difficulty
          </span>
        </p>
        <div id="difficultyChooserWrap" class="hidden">
          <div class="flex justify-center">
            <div id="difficultyChooser" class="inline-flex rounded-full bg-surface-container p-1 text-label-md">
              <button data-diff="easy"   class="h-9 px-5 rounded-full">Easy</button>
              <button data-diff="medium" class="h-9 px-5 rounded-full">Medium</button>
              <button data-diff="hard"   class="h-9 px-5 rounded-full">Hard</button>
            </div>
          </div>
          <p id="difficultyHint" class="text-center text-label-md text-on-surface-variant mt-3">Pick one to unlock topics ↓</p>
        </div>

        <!-- Step 3: Topic -->
        <p id="topicStepLabel" class="text-center text-label-md font-bold text-on-surface-variant mt-6 mb-3 hidden">
          <span class="inline-flex items-center gap-1.5">
            <span class="w-5 h-5 rounded-full bg-primary text-on-primary text-[12px] flex items-center justify-center font-bold">3</span>
            Pick a topic
          </span>
        </p>
        <div id="topicGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 opacity-50 pointer-events-none transition"></div>
      </div>
    </section>

    <!-- Active session -->
    <section id="session"
             class="hidden flex flex-col items-center justify-center px-4 md:px-6 pt-20 md:pt-24 pb-8"
             style="min-height: calc(100vh - 64px);">
      <div class="w-full max-w-2xl mx-auto">
      <div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm p-6 md:p-8">
        <div id="questionArea" class="space-y-5">
          <div id="skeleton" class="animate-pulse space-y-3">
            <div class="h-5 w-2/3 bg-surface-container rounded"></div>
            <div class="h-4 w-full bg-surface-container rounded"></div>
            <div class="h-10 w-full bg-surface-container rounded"></div>
            <div class="h-10 w-full bg-surface-container rounded"></div>
          </div>
        </div>

        <div id="feedback" class="hidden mt-6 pt-6 border-t border-outline-variant/50 space-y-3"></div>

        <div class="mt-6 pt-4 border-t border-outline-variant/50 flex items-center justify-between gap-3">
          <div class="flex items-center gap-1">
            <button id="hintBtn" class="h-10 px-3 rounded-lg text-label-md font-bold text-primary hover:bg-primary-container/10 hidden inline-flex items-center gap-1.5">
              <span class="material-symbols-outlined" style="font-size:18px">lightbulb</span> Hint
            </button>
            <button id="revealBtn" class="h-10 px-3 rounded-lg text-label-md font-bold text-on-surface-variant hover:bg-surface-container-low inline-flex items-center gap-1.5">
              <span class="material-symbols-outlined" style="font-size:18px">visibility</span> Show Answer
            </button>
          </div>
          <div class="ml-auto flex gap-2">
            <button id="submitBtn" class="h-11 px-6 rounded-lg bg-primary text-on-primary font-bold text-label-md hover:opacity-90 disabled:opacity-50 active:scale-[0.98] transition">Submit Answer</button>
            <button id="nextBtn"   class="h-11 px-6 rounded-lg bg-primary text-on-primary font-bold text-label-md hover:opacity-90 hidden active:scale-[0.98] transition">Next Question</button>
          </div>
        </div>
      </div>

      <!-- Mobile difficulty toggle (hidden on sm+, shown on small screens) -->
      <div id="difficultyMobile" class="sm:hidden mt-4 inline-flex rounded-full bg-surface-container p-1 text-label-md self-center"></div>

      <!-- Progress bar -->
      <div class="mt-6">
        <div class="w-full h-1.5 bg-surface-container rounded-full overflow-hidden">
          <div id="progressBar" class="h-full bg-primary rounded-full transition-all duration-500" style="width:10%"></div>
        </div>
        <p class="text-center text-label-md text-on-surface-variant mt-2">
          <span id="progressLabel">1 of 10 questions</span>
        </p>
      </div>
      </div>
    </section>

    <!-- Results -->
    <section id="results"
             class="hidden flex flex-col items-center justify-center px-4 md:px-6 py-8"
             style="min-height: calc(100vh - 64px);">
      <div class="w-full max-w-2xl mx-auto bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm p-8 text-center">
        <span class="material-symbols-outlined text-primary" style="font-size:48px">emoji_events</span>
        <h2 class="text-headline-md font-headline-md mt-2">Session Complete</h2>
        <p id="resultScore" class="text-metric-display font-metric-display mt-4"></p>
        <p id="resultPercent" class="text-body-lg text-on-surface-variant"></p>
        <p id="encouragementResult" class="mt-4 text-body-md text-primary font-bold italic"></p>
        <div class="mt-6 flex flex-wrap items-center justify-center gap-3">
          <button id="saveBtn" class="h-12 px-5 rounded-lg bg-primary text-on-primary font-bold text-label-md hover:opacity-90">Save & Return to Dashboard</button>
          <button id="retryBtn" class="h-12 px-5 rounded-lg ring-1 ring-outline-variant text-on-surface font-bold text-label-md hover:bg-surface-container-low">Try Again</button>
        </div>
      </div>
    </section>
  </main>

<script type="module">
  import { renderShell } from '/js/layout.js';
  import { apiJson, apiFetch, isGuest, getAccessToken } from '/js/auth.js';
  import { formatMathDeep } from '/js/math-format.js';
  import { randomEncouragement } from '/js/encouragement.js';

  const guest = isGuest() && !getAccessToken();
  let guestBar = null;
  if (!guest) renderShell({ active: 'practice_session' });
  else {
    // Guests have no sidebar — strip every sidebar offset so the session bar
    // and main content can center against the full viewport.
    document.querySelector('main')?.classList.remove('md:pl-64');
    document.getElementById('sessionBar')?.classList.remove('md:left-64');
    // Minimal guest top bar (shown on chooser + results, hidden during session)
    guestBar = document.createElement('header');
    guestBar.id = 'guestBar';
    guestBar.className = 'fixed top-0 inset-x-0 h-14 bg-surface-container-lowest border-b border-outline-variant z-30 flex items-center justify-between px-margin-mobile md:px-margin-desktop';
    guestBar.innerHTML = `
      <a href="/index" class="flex items-center gap-2 text-primary font-bold text-headline-sm">
        <span class="material-symbols-outlined" style="font-size:22px">menu_book</span>GED Study Guide
      </a>
      <div class="flex items-center gap-2">
        <span class="hidden md:inline text-label-md text-on-surface-variant">Guest mode</span>
        <a href="/study_guide" target="_blank" rel="noopener" class="hidden sm:inline-flex items-center gap-1.5 h-9 px-3 rounded-lg text-on-surface-variant hover:bg-surface-container text-label-md font-bold">
          <span class="material-symbols-outlined" style="font-size:18px">auto_stories</span>
          Study Guide
        </a>
        <a href="/study_guide" target="_blank" rel="noopener" class="sm:hidden w-9 h-9 rounded-full hover:bg-surface-container flex items-center justify-center text-on-surface-variant" aria-label="Open study guide">
          <span class="material-symbols-outlined" style="font-size:20px">auto_stories</span>
        </a>
        <button id="guestThemeBtn" class="w-9 h-9 rounded-full hover:bg-surface-container flex items-center justify-center text-on-surface-variant" aria-label="Toggle theme">
          <span class="material-symbols-outlined" id="guestThemeIcon" style="font-size:20px">dark_mode</span>
        </button>
        <a href="/create_account" class="h-9 px-3 rounded-lg bg-primary text-on-primary text-label-md font-bold flex items-center">Sign Up Free</a>
      </div>`;
    document.body.prepend(guestBar);
    const gThemeBtn = document.getElementById('guestThemeBtn');
    const gThemeIcon = document.getElementById('guestThemeIcon');
    const syncGuestTheme = () => { gThemeIcon.textContent = window.GedTheme?.isDark() ? 'light_mode' : 'dark_mode'; };
    syncGuestTheme();
    gThemeBtn.addEventListener('click', () => window.GedTheme?.toggle());
    window.addEventListener('ged-theme-change', syncGuestTheme);
  }
  function setGuestBar(visible) {
    if (!guestBar) return;
    guestBar.classList.toggle('hidden', !visible);
  }

  // Static fallback used for the topic icon. The full topic list comes from
  // /api/user/catalog at chooser time so the picker is always in sync with
  // the backend subjects.js + gedTopicGuides.js.
  const TOPIC_ICONS = {
    'algebra': 'function',
    'linear-equations': 'show_chart',
    'fractions': 'percent',
    'geometry': 'square_foot',
    'stats': 'bar_chart',
    'civics-government': 'gavel',
    'us-history': 'flag',
    'economics': 'payments',
    'geography': 'public',
    'world-history': 'history_edu'
  };
  let CATALOG = null;          // populated from /api/user/catalog on first showChooser()
  let TOPICS = [];             // topics for the CURRENTLY selected subject

  async function loadCatalog() {
    if (CATALOG) return CATALOG;
    const res = await fetch('/api/user/catalog');
    CATALOG = (await res.json()).subjects || [];
    return CATALOG;
  }

  const QUESTIONS_PER_SESSION = 10;
  const params = new URLSearchParams(location.search);
  // Deep-link from the dashboard quick-start cards: ?subject=math&topic=algebra
  const initialSubject = params.get('subject');
  const initialTopic   = params.get('topic');

  // Map subject → PDF path so feedback buttons jump to the right guide.
  const SUBJECT_PDF = { 'math': '/study-guide.pdf', 'social-studies': '/social-studies-guide.pdf' };
  const subjectPdfFor = (subj) => SUBJECT_PDF[subj] || '/study-guide.pdf';

  const session = {
    subject: initialSubject || null,
    topic: initialTopic,
    difficulty: null,
    questions: [],
    answers: [],
    currentIndex: 0,
    score: 0,
    startTime: Date.now()
  };
  let timerInterval = null;
  let answered = false;
  let selectedAnswer = null;

  // Prefetch holder: a promise for the NEXT question that's generated in the background
  // while the user is reading the current one.
  let prefetchPromise = null;

  // Idle timeout: route back to chooser after 5 min of no interaction.
  const IDLE_MS = 5 * 60 * 1000;
  let idleTimer = null;
  function resetIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(handleIdleTimeout, IDLE_MS);
  }
  function stopIdle() { clearTimeout(idleTimer); idleTimer = null; }
  function handleIdleTimeout() {
    clearInterval(timerInterval);
    prefetchPromise = null;
    showToast('Session timed out due to 5 minutes of inactivity.');
    showChooser();
  }
  ['click', 'keydown', 'mousemove', 'touchstart', 'scroll'].forEach(ev =>
    document.addEventListener(ev, () => { if (idleTimer) resetIdle(); }, { passive: true })
  );

  function showToast(msg) {
    let t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-3 bg-on-surface text-on-primary rounded-lg shadow-lg z-50 text-label-md max-w-[90vw] text-center';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .4s'; }, 4000);
  }

  async function callApi(url, options) {
    if (guest) {
      const res = await fetch(url, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || `Request failed (${res.status})`);
      return data;
    }
    return apiJson(url, options);
  }

  function showGuestNudge() {
    if (!guest) return;
    let el = document.getElementById('guestNudge');
    if (!el) {
      el = document.createElement('div');
      el.id = 'guestNudge';
      el.className = 'fixed bottom-6 left-4 right-4 md:left-auto md:right-6 md:max-w-md p-4 bg-primary text-on-primary rounded-xl shadow-lg flex items-center justify-between gap-3 z-50';
      el.innerHTML = `
        <div class="min-w-0">
          <p class="text-label-md font-bold">Enjoying GED Study Guide?</p>
          <p class="text-label-md opacity-90">Create a free account to save progress & unlock all features.</p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="nudgeClose" class="w-9 h-9 rounded-full hover:bg-white/10 flex items-center justify-center" aria-label="Dismiss">
            <span class="material-symbols-outlined" style="font-size:20px">close</span>
          </button>
          <a href="/create_account" class="h-9 px-3 rounded-lg bg-on-primary text-primary text-label-md font-bold flex items-center">Sign Up Free</a>
        </div>`;
      document.body.appendChild(el);
      el.querySelector('#nudgeClose').addEventListener('click', () => el.remove());
    }
    el.classList.remove('hidden');
    clearTimeout(showGuestNudge._t);
    showGuestNudge._t = setTimeout(() => el?.classList.add('hidden'), 8000);
  }

  const $ = id => document.getElementById(id);
  const escape = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // Wrap the leading "Step N:" label in <strong> for scannability.
  // Safe to call on already-escaped text — we only inject one <strong> tag.
  const boldStepLabel = s => escape(s).replace(/^(Step\s+\d+:)/i, '<strong class="font-bold text-on-surface">$1</strong>');

  // Bold the lead-in phrase "The correct answer is X." in explanation text so
  // it pops at a glance. Matches both single-letter (A-D) and short numeric
  // answers, with or without a trailing period. Applies only to the very
  // start of the paragraph (anchored to ^) so we never accidentally bold a
  // mid-sentence quote of the same words.
  const boldCorrectAnswer = s => escape(s).replace(
    /^(The correct answer is\s+[^.\n]{1,40}\.?)/i,
    '<strong class="font-bold text-on-surface">$1</strong>'
  );

  function subjectCard(s) {
    return `<button data-subject="${s.slug}" class="text-left bg-surface-container-lowest rounded-xl border border-outline-variant p-6 hover:border-primary hover:shadow-sm transition w-full">
      <div class="w-12 h-12 rounded-lg bg-primary/10 flex items-center justify-center mb-4">
        <span class="material-symbols-outlined text-primary" style="font-size:26px">${s.icon}</span>
      </div>
      <p class="text-headline-sm font-headline-sm">${s.name}</p>
      <p class="text-label-md text-on-surface-variant mt-1">${s.description || ''}</p>
    </button>`;
  }

  function topicCard(t) {
    const icon = TOPIC_ICONS[t.slug] || 'category';
    return `<button data-topic="${t.slug}" class="text-left bg-surface-container-lowest rounded-xl border border-outline-variant p-5 hover:border-primary hover:shadow-sm transition w-full">
      <div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center mb-3">
        <span class="material-symbols-outlined text-primary" style="font-size:22px">${icon}</span>
      </div>
      <p class="text-headline-sm font-headline-sm">${t.name}</p>
      <p class="text-label-md text-on-surface-variant mt-1">10 questions · ~10 min</p>
    </button>`;
  }

  function renderSubjectGrid() {
    $('subjectGrid').innerHTML = (CATALOG || []).map(subjectCard).join('');
  }

  function renderTopicGrid() {
    TOPICS = (CATALOG.find(s => s.slug === session.subject)?.topics) || [];
    $('topicGrid').innerHTML = TOPICS.map(topicCard).join('');
  }

  function setStepEnabled(step) {
    // step: 'subject' | 'difficulty' | 'topic'
    $('difficultyStepLabel').classList.toggle('hidden', step === 'subject');
    $('difficultyChooserWrap').classList.toggle('hidden', step === 'subject');
    const topicReady = step === 'topic';
    $('topicStepLabel').classList.toggle('hidden', !topicReady);
    $('topicGrid').classList.toggle('opacity-50', !topicReady);
    $('topicGrid').classList.toggle('pointer-events-none', !topicReady);
    // Highlight chosen subject
    document.querySelectorAll('#subjectGrid [data-subject]').forEach(b => {
      const a = b.dataset.subject === session.subject;
      b.classList.toggle('border-primary', a);
      b.classList.toggle('ring-2', a);
      b.classList.toggle('ring-primary/20', a);
    });
  }

  async function showChooser() {
    $('chooser').classList.remove('hidden');
    $('session').classList.add('hidden');
    $('results').classList.add('hidden');
    $('sessionBar').classList.add('hidden');
    setGuestBar(true);

    if (!CATALOG) {
      $('subjectGrid').innerHTML = `<div class="col-span-full text-on-surface-variant text-label-md">Loading subjects...</div>`;
      try { await loadCatalog(); } catch (e) {
        $('subjectGrid').innerHTML = `<div class="col-span-full text-error text-label-md">${e.message}</div>`;
        return;
      }
    }
    renderSubjectGrid();
    renderDifficulty();
    setStepEnabled(session.subject ? (session.difficulty ? 'topic' : 'difficulty') : 'subject');
    if (session.subject) renderTopicGrid();
  }

  // Subject click → reveal difficulty step
  document.addEventListener('click', (e) => {
    const b = e.target.closest('#subjectGrid [data-subject]');
    if (!b) return;
    session.subject = b.dataset.subject;
    session.topic = null;
    renderTopicGrid();
    setStepEnabled(session.difficulty ? 'topic' : 'difficulty');
  });

  // Topic click → start the session
  document.addEventListener('click', (e) => {
    const b = e.target.closest('#topicGrid [data-topic]');
    if (!b) return;
    if (!session.subject || !session.difficulty) return; // gated
    session.topic = b.dataset.topic;
    prefetchPromise = null;
    session.questions = [];
    startPrefetch();
    startSession();
  });

  // Mirror desktop difficulty pills to mobile container
  function buildDifficultyHTML() {
    return ['easy', 'medium', 'hard'].map(d =>
      `<button data-diff="${d}" class="h-7 px-3 rounded-full">${d[0].toUpperCase()}${d.slice(1)}</button>`
    ).join('');
  }
  $('difficultyMobile').innerHTML = buildDifficultyHTML();

  function startSession() {
    Object.assign(session, { questions: [], answers: [], currentIndex: 0, score: 0, startTime: Date.now() });
    prefetchPromise = null;
    $('chooser').classList.add('hidden');
    $('results').classList.add('hidden');
    $('session').classList.remove('hidden');
    $('sessionBar').classList.remove('hidden');
    setGuestBar(false);
    const t = TOPICS.find(t => t.slug === session.topic) || { name: session.topic };
    const icon = TOPIC_ICONS[session.topic] || 'category';
    $('topicBadge').innerHTML = `<span class="material-symbols-outlined" style="font-size:16px">${icon}</span>${t.name}`;
    renderDifficulty();
    startTimer();
    resetIdle();
    loadNextQuestion();
  }

  // Fire-and-store: kick off generation for the NEXT question while user reads current.
  function startPrefetch() {
    if (prefetchPromise) return;
    const endpoint = guest ? '/api/practice/generate-guest' : '/api/practice/generate';
    prefetchPromise = callApi(endpoint, {
      method: 'POST',
      body: JSON.stringify({
        subject: session.subject,
        topic: session.topic,
        difficulty: session.difficulty,
        previousQuestions: session.questions.map(q => q.question)
      })
    }).catch(err => { console.warn('[prefetch] failed:', err.message); prefetchPromise = null; throw err; });
  }

  function renderDifficulty() {
    document.querySelectorAll('#difficultyGroup button, #difficultyMobile button').forEach(b => {
      const a = b.dataset.diff === session.difficulty;
      b.className = `h-7 px-3 rounded-full text-label-md transition ${a ? 'bg-primary text-on-primary font-bold' : 'text-on-surface-variant hover:bg-surface-container-high'}`;
    });
    document.querySelectorAll('#difficultyChooser button').forEach(b => {
      const a = b.dataset.diff === session.difficulty;
      b.className = `h-9 px-5 rounded-full text-label-md transition ${a ? 'bg-primary text-on-primary font-bold' : 'text-on-surface-variant hover:bg-surface-container-high'}`;
    });
    const hint = document.getElementById('difficultyHint');
    if (hint) hint.classList.toggle('hidden', !!session.difficulty);
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('#difficultyGroup button, #difficultyMobile button, #difficultyChooser button');
    if (!b) return;
    session.difficulty = b.dataset.diff;
    renderDifficulty();
    if (session.subject && session.difficulty && !$('chooser').classList.contains('hidden')) {
      setStepEnabled('topic');
    }
  });

  function updateProgress() {
    const idx = session.currentIndex + 1;
    const pct = (idx / QUESTIONS_PER_SESSION) * 100;
    const pb = document.getElementById('progressBar');
    const pl = document.getElementById('progressLabel');
    if (pb) pb.style.width = pct + '%';
    if (pl) pl.textContent = `${idx} of ${QUESTIONS_PER_SESSION} questions`;
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const sec = Math.floor((Date.now() - session.startTime) / 1000);
      const m = Math.floor(sec / 60), s = sec % 60;
      $('timer').textContent = `${m}:${String(s).padStart(2, '0')}`;
    }, 500);
  }

  async function loadNextQuestion() {
    answered = false;
    selectedAnswer = null;
    $('feedback').classList.add('hidden');
    $('feedback').innerHTML = '';
    $('submitBtn').classList.remove('hidden');
    $('submitBtn').disabled = false;
    $('submitBtn').textContent = 'Submit Answer';
    $('nextBtn').classList.add('hidden');
    $('hintBtn').classList.add('hidden');
    $('revealBtn').classList.remove('hidden');
    $('qCounter').textContent = `Question ${session.currentIndex + 1} of ${QUESTIONS_PER_SESSION}`;
    updateProgress();
    $('questionArea').innerHTML = `<div id="skeleton" class="animate-pulse space-y-3">
      <div class="h-5 w-2/3 bg-surface-container rounded"></div>
      <div class="h-4 w-full bg-surface-container rounded"></div>
      <div class="h-10 w-full bg-surface-container rounded"></div>
      <div class="h-10 w-full bg-surface-container rounded"></div>
    </div>`;

    try {
      let data;
      if (prefetchPromise) {
        // Use the question that was generated in the background while user was reading prev one.
        data = await prefetchPromise;
        prefetchPromise = null;
      } else {
        const endpoint = guest ? '/api/practice/generate-guest' : '/api/practice/generate';
        data = await callApi(endpoint, {
          method: 'POST',
          body: JSON.stringify({
            subject: session.subject,
        topic: session.topic,
            difficulty: session.difficulty,
            previousQuestions: session.questions.map(q => q.question)
          })
        });
      }
      const q = formatMathDeep(data.question);
      session.questions.push(q);
      renderQuestion(q);

      // Kick off prefetch for the question AFTER this one, unless we're on the last.
      if (session.currentIndex + 1 < QUESTIONS_PER_SESSION) startPrefetch();
    } catch (e) {
      $('questionArea').innerHTML = `<p class="text-error">${e.message}</p>`;
    }
  }

  function calcBadge(q) {
    if (q.calculatorAllowed === undefined || q.calculatorAllowed === null) return '';
    return q.calculatorAllowed
      ? `<div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#ecfdf5] text-[#047857] text-label-md font-bold" title="${escape(q.calculatorReasoning || '')}">
          <span class="material-symbols-outlined" style="font-size:16px">calculate</span>Calculator allowed
        </div>`
      : `<div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#fef3c7] text-[#92400e] text-label-md font-bold" title="${escape(q.calculatorReasoning || '')}">
          <span class="material-symbols-outlined" style="font-size:16px">do_not_disturb</span>No calculator
        </div>`;
  }

  function renderQuestion(q) {
    const isMC = q.type === 'multiple_choice' && Array.isArray(q.options);
    const body = `
      ${calcBadge(q)}
      <p class="text-body-lg font-body-lg leading-relaxed">${escape(q.question)}</p>
      ${isMC
        ? `<div id="optionList" class="space-y-2">${q.options.map((opt, i) => {
            const letter = opt.match(/^[A-D]\)/) ? opt[0] : String.fromCharCode(65 + i);
            return `<label class="option flex items-center gap-3 p-3 rounded-lg ring-1 ring-outline-variant cursor-pointer hover:bg-surface-container-low transition" data-letter="${letter}">
              <input type="radio" name="opt" value="${letter}" class="text-primary focus:ring-primary" />
              <span class="text-body-md">${escape(opt)}</span>
            </label>`;
          }).join('')}</div>`
        : `<input id="freeInput" type="text" placeholder="Type your answer" class="w-full px-4 py-3 bg-surface rounded-lg outline-none ring-1 ring-outline-variant focus:ring-2 focus:ring-primary text-body-md" />`}
    `;
    $('questionArea').innerHTML = body;
    if (q.hint) $('hintBtn').classList.remove('hidden');
  }

  $('hintBtn').addEventListener('click', () => {
    const q = session.questions[session.currentIndex];
    if (!q?.hint) return;
    let hintEl = document.getElementById('hintBox');
    if (hintEl) return;
    hintEl = document.createElement('div');
    hintEl.id = 'hintBox';
    hintEl.className = 'p-3 rounded-lg bg-secondary-container/40 text-on-secondary-container text-label-md';
    hintEl.innerHTML = `<strong>Hint:</strong> ${escape(q.hint)}`;
    $('questionArea').appendChild(hintEl);
  });

  $('revealBtn').addEventListener('click', () => {
    if (answered) return;
    const q = session.questions[session.currentIndex];
    if (!q) return;

    // Mark the question as answered + incorrect, but stay on the SAME screen
    // so the user can study the question alongside the steps.
    answered = true;
    session.answers.push({
      userAnswer: '(revealed)',
      isCorrect: false,
      explanation: `You revealed the answer. The correct answer was ${q.correctAnswer}.`,
      steps: q.steps || []
    });

    // Highlight the correct option in green (same treatment as a wrong submit)
    if (q.type === 'multiple_choice') {
      document.querySelectorAll('.option').forEach(el => {
        const letter = el.dataset.letter;
        if (letter === q.correctAnswer) el.classList.add('ring-2', 'ring-[#10b981]', 'bg-[#ecfdf5]');
        // Lock all radio inputs so the user can't toggle them after reveal
        const input = el.querySelector('input[type="radio"]');
        if (input) input.disabled = true;
      });
    } else {
      const freeIn = document.getElementById('freeInput');
      if (freeIn) { freeIn.disabled = true; freeIn.value = q.correctAnswer; }
    }

    // Render the step-by-step solution inline (uses the same #feedback panel
    // for layout consistency, but with a "revealed" heading instead of correct/wrong).
    const steps = (q.steps && q.steps.length) ? q.steps : [];
    const pageNum = Number(q.studyGuidePage)
                  || Number(q.studyGuideReference?.match(/Page\s+(\d+)/i)?.[1])
                  || TOPICS.find(t => t.slug === session.topic)?.firstPage
                  || 1;
    const stepsBlock = steps.length
      ? `<div class="bg-surface-container-low rounded-lg p-4 border border-outline-variant/40">
          <p class="text-label-md font-bold text-on-surface mb-3 flex items-center gap-1.5">
            <span class="material-symbols-outlined" style="font-size:18px">checklist</span>
            Step-by-step solution
          </p>
          <div class="space-y-2 text-body-md text-on-surface leading-relaxed">
            ${steps.map(s => `<p>${boldStepLabel(s)}</p>`).join('')}
          </div>
        </div>` : '';

    $('feedback').innerHTML = `
      <div class="flex items-center gap-2 text-primary">
        <span class="material-symbols-outlined" style="font-size:24px">visibility</span>
        <p class="text-headline-sm font-headline-sm">Answer revealed</p>
      </div>
      <p class="text-body-md text-on-surface-variant">The correct answer was <strong>${escape(q.correctAnswer)}</strong>. This question is marked incorrect — study the steps and try the next one.</p>
      ${stepsBlock}
      ${q.studyGuideReference ? `<div class="p-3 bg-surface-container-low border border-outline-variant rounded-lg flex flex-col sm:flex-row sm:items-center gap-3">
        <div class="flex items-start gap-2 flex-1 min-w-0">
          <span class="material-symbols-outlined text-primary" style="font-size:18px">menu_book</span>
          <p class="text-label-md text-on-surface-variant min-w-0"><span class="font-bold text-primary">From your study guide:</span> ${escape(q.studyGuideReference)}</p>
        </div>
        <a href="${subjectPdfFor(session.subject)}#page=${pageNum}" target="_blank" rel="noopener" class="shrink-0 inline-flex items-center justify-center gap-1.5 h-9 px-3 rounded-lg bg-primary text-on-primary text-label-md font-bold hover:opacity-90">
          <span class="material-symbols-outlined" style="font-size:18px">auto_stories</span>
          Review Study Guide
        </a>
      </div>` : ''}
    `;
    $('feedback').classList.remove('hidden');

    // Submit button stays VISIBLE but disabled with a clarifying label so the
    // user knows the question is locked. Next button appears beside it.
    $('submitBtn').disabled = true;
    $('submitBtn').textContent = 'Answer revealed';
    $('hintBtn').classList.add('hidden');
    $('revealBtn').classList.add('hidden');
    $('nextBtn').classList.remove('hidden');
    $('nextBtn').textContent = session.currentIndex + 1 >= QUESTIONS_PER_SESSION ? 'See Results' : 'Next Question';
  });

  $('submitBtn').addEventListener('click', async () => {
    if (answered) return;
    const q = session.questions[session.currentIndex];
    const isMC = q.type === 'multiple_choice' && Array.isArray(q.options);
    let userAnswer;
    if (isMC) {
      const checked = document.querySelector('input[name="opt"]:checked');
      if (!checked) return;
      userAnswer = checked.value;
      selectedAnswer = userAnswer;
    } else {
      const v = document.getElementById('freeInput')?.value.trim();
      if (!v) return;
      userAnswer = v;
    }

    answered = true;
    $('submitBtn').disabled = true;
    $('feedback').classList.remove('hidden');
    $('feedback').innerHTML = `<div class="animate-pulse text-on-surface-variant">Checking your answer...</div>`;

    try {
      const checkEndpoint = guest ? '/api/practice/check-guest' : '/api/practice/check';
      const result = await callApi(checkEndpoint, {
        method: 'POST',
        body: JSON.stringify({
          question: q.question,
          correctAnswer: q.correctAnswer,
          userAnswer,
          subject: session.subject,
          topic: session.topic
        })
      });
      const cleaned = formatMathDeep(result);
      session.answers.push({ userAnswer, isCorrect: cleaned.isCorrect, ...cleaned });
      if (cleaned.isCorrect) session.score++;
      renderFeedback(q, userAnswer, cleaned);
    } catch (e) {
      $('feedback').innerHTML = `<p class="text-error">${e.message}</p>`;
      $('submitBtn').disabled = false;
      answered = false;
    }
  });

  function renderFeedback(q, userAnswer, result) {
    // Mark options
    if (q.type === 'multiple_choice') {
      document.querySelectorAll('.option').forEach(el => {
        const letter = el.dataset.letter;
        if (letter === q.correctAnswer) el.classList.add('ring-2', 'ring-[#10b981]', 'bg-[#ecfdf5]');
        else if (letter === userAnswer && !result.isCorrect) el.classList.add('ring-2', 'ring-[#ef4444]', 'bg-[#fef2f2]');
      });
    }
    const okIcon = result.isCorrect
      ? `<span class="material-symbols-outlined text-[#10b981]" style="font-size:24px">check_circle</span>`
      : `<span class="material-symbols-outlined text-[#ef4444]" style="font-size:24px">cancel</span>`;
    const calcBlock = q.calculatorReasoning
      ? `<div class="p-3 bg-surface-container-low border border-outline-variant rounded-lg flex items-start gap-2">
          <span class="material-symbols-outlined ${q.calculatorAllowed ? 'text-[#047857]' : 'text-[#92400e]'}" style="font-size:18px">${q.calculatorAllowed ? 'calculate' : 'do_not_disturb'}</span>
          <p class="text-label-md text-on-surface-variant"><span class="font-bold ${q.calculatorAllowed ? 'text-[#047857]' : 'text-[#92400e]'}">${q.calculatorAllowed ? 'Calculator allowed on test:' : 'No calculator on test:'}</span> ${escape(q.calculatorReasoning)}</p>
        </div>` : '';
    // Page number for "Review Study Guide" button. Three-tier fallback:
    //   1) the structured studyGuidePage field Gemini returns
    //   2) parse "Page N" out of studyGuideReference
    //   3) the topic's section first page (so the button never lands on page 1)
    const topicFirstPage = TOPICS.find(t => t.slug === session.topic)?.firstPage;
    const refPageNum = q.studyGuideReference?.match(/Page\s+(\d+)/i)?.[1];
    const pageNum = Number(q.studyGuidePage) || Number(refPageNum) || topicFirstPage || 1;
    const pdfHref = `${subjectPdfFor(session.subject)}#page=${pageNum}`;

    const refBlock = q.studyGuideReference
      ? `<div class="p-3 bg-surface-container-low border border-outline-variant rounded-lg flex flex-col sm:flex-row sm:items-center gap-3">
          <div class="flex items-start gap-2 flex-1 min-w-0">
            <span class="material-symbols-outlined text-primary" style="font-size:18px">menu_book</span>
            <p class="text-label-md text-on-surface-variant min-w-0"><span class="font-bold text-primary">From your study guide:</span> ${escape(q.studyGuideReference)}</p>
          </div>
          ${!result.isCorrect ? `<a href="${pdfHref}" target="_blank" rel="noopener" class="shrink-0 inline-flex items-center justify-center gap-1.5 h-9 px-3 rounded-lg bg-primary text-on-primary text-label-md font-bold hover:opacity-90">
            <span class="material-symbols-outlined" style="font-size:18px">auto_stories</span>
            Review Study Guide
          </a>` : ''}
        </div>` : '';

    $('feedback').innerHTML = `
      <div class="flex items-center gap-2 ${result.isCorrect ? 'text-[#10b981]' : 'text-[#ef4444]'}">
        ${okIcon}
        <p class="text-headline-sm font-headline-sm">${result.isCorrect ? 'Correct!' : 'Not quite.'}</p>
      </div>
      <p class="text-body-md text-on-surface-variant">${boldCorrectAnswer(result.explanation || '')}</p>
      ${(() => {
        // Always show a step-by-step breakdown. Prefer the checker's steps;
        // fall back to the question's own pre-generated steps if the checker
        // didn't return any (e.g. when the user clicked Show Answer).
        const steps = (result.steps && result.steps.length) ? result.steps
                    : (q.steps && q.steps.length) ? q.steps : null;
        if (!steps) return '';
        // Render as stacked paragraphs. The AI already prefixes each step
        // with "Step 1:", "Step 2:", etc., so an ordered list would just
        // duplicate the numbering.
        return `<div class="bg-surface-container-low rounded-lg p-4 border border-outline-variant/40">
          <p class="text-label-md font-bold text-on-surface mb-3 flex items-center gap-1.5">
            <span class="material-symbols-outlined" style="font-size:18px">checklist</span>
            Step-by-step solution
          </p>
          <div class="space-y-2 text-body-md text-on-surface leading-relaxed">
            ${steps.map(s => `<p>${boldStepLabel(s)}</p>`).join('')}
          </div>
        </div>`;
      })()}
      ${calcBlock}
      ${refBlock}
      ${result.encouragement ? `<p class="text-label-md italic text-on-surface-variant">${escape(result.encouragement)}</p>` : ''}
    `;
    $('submitBtn').classList.add('hidden');
    $('hintBtn').classList.add('hidden');
    $('revealBtn').classList.add('hidden');
    $('nextBtn').classList.remove('hidden');
    $('nextBtn').textContent = session.currentIndex + 1 >= QUESTIONS_PER_SESSION ? 'See Results' : 'Next Question';
  }

  $('nextBtn').addEventListener('click', () => {
    session.currentIndex++;
    if (session.currentIndex >= QUESTIONS_PER_SESSION) return finishSession();
    if (guest && session.currentIndex > 0 && session.currentIndex % 5 === 0) showGuestNudge();
    loadNextQuestion();
  });

  function finishSession() {
    clearInterval(timerInterval);
    stopIdle();
    prefetchPromise = null;
    $('session').classList.add('hidden');
    $('sessionBar').classList.add('hidden');
    setGuestBar(true);
    $('results').classList.remove('hidden');
    // Drop in a personalized encouragement under the score.
    const encEl = document.getElementById('encouragementResult');
    if (encEl) {
      let user = null;
      try { user = JSON.parse(localStorage.getItem('ged_user') || 'null'); } catch {}
      encEl.textContent = randomEncouragement(user?.firstName);
    }
    const pct = Math.round((session.score / QUESTIONS_PER_SESSION) * 100);
    $('resultScore').textContent = `${session.score} / ${QUESTIONS_PER_SESSION}`;
    $('resultScore').className = `text-metric-display font-metric-display mt-4 ${pct >= 80 ? 'text-[#10b981]' : pct >= 60 ? 'text-[#f59e0b]' : 'text-error'}`;
    $('resultPercent').textContent = `${pct}% correct`;
    if (guest) {
      $('saveBtn').textContent = 'Sign Up to Save Progress';
      $('saveBtn').onclick = () => { window.location.href = '/create_account'; };
    }
  }

  $('saveBtn').addEventListener('click', async () => {
    if (guest) { window.location.href = '/create_account'; return; }
    $('saveBtn').disabled = true;
    try {
      await apiJson('/api/practice/save-session', {
        method: 'POST',
        body: JSON.stringify({
          subject: session.subject,
        topic: session.topic,
          difficulty: session.difficulty,
          score: session.score,
          total: QUESTIONS_PER_SESSION,
          timeSpent: Math.floor((Date.now() - session.startTime) / 1000),
          questions: session.questions.map((q, i) => ({
            question: q.question,
            correctAnswer: q.correctAnswer,
            userAnswer: session.answers[i]?.userAnswer,
            isCorrect: !!session.answers[i]?.isCorrect,
            studyGuideReference: q.studyGuideReference || null
          }))
        })
      });
      window.location.href = '/dashboard';
    } catch (e) {
      alert(e.message);
      $('saveBtn').disabled = false;
    }
  });
  $('retryBtn').addEventListener('click', () => startSession());

  // If we have a deep link (subject + topic) we still show the chooser so the
  // user explicitly picks a difficulty — the subject and topic are pre-selected.
  showChooser();
</script>
</body>
</html>
