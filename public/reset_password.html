<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/favicon.png" />
<title>Reset Password — GED Study Guide</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<script src="/js/theme.js"></script>
<script src="/js/theme-toggle-floating.js" defer></script>
<style>body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
  <main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-lg p-8 md:p-10">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-container/10 mb-4">
        <span class="material-symbols-outlined text-primary" style="font-size:28px">key</span>
      </div>
      <h1 class="text-headline-md font-headline-md mb-2">Set a new password</h1>
      <p class="text-body-md text-on-surface-variant">Pick something memorable but strong — at least 8 characters with a letter and a number.</p>
    </div>

    <div id="noToken" class="hidden p-3 mb-4 rounded-lg bg-error-container text-on-error-container text-label-md text-center">
      No reset token in URL. Request a new <a href="/forgot_password" class="font-bold underline">reset link</a>.
    </div>

    <form id="resetForm" class="space-y-4" novalidate>
      <div class="space-y-2">
        <label class="block text-label-md font-label-md" for="newPassword">New Password</label>
        <div class="relative">
          <input id="newPassword" type="password" autocomplete="new-password" required
                 class="w-full px-4 py-3 pr-12 bg-surface rounded-lg text-body-md outline-none ring-1 ring-outline-variant focus:ring-2 focus:ring-primary transition" />
          <button type="button" data-pw-toggle="newPassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline-variant hover:text-on-surface-variant" aria-label="Show password">
            <span class="material-symbols-outlined pw-icon">visibility</span>
          </button>
        </div>
      </div>

      <div class="space-y-2">
        <label class="block text-label-md font-label-md" for="confirmPassword">Confirm Password</label>
        <div class="relative">
          <input id="confirmPassword" type="password" autocomplete="new-password" required
                 class="w-full px-4 py-3 pr-12 bg-surface rounded-lg text-body-md outline-none ring-1 ring-outline-variant focus:ring-2 focus:ring-primary transition" />
          <button type="button" data-pw-toggle="confirmPassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline-variant hover:text-on-surface-variant" aria-label="Show password">
            <span class="material-symbols-outlined pw-icon">visibility</span>
          </button>
        </div>
      </div>

      <p id="errorMsg" class="text-error text-label-md hidden"></p>
      <p id="successMsg" class="text-[#047857] text-label-md hidden"></p>

      <button id="submitBtn" type="submit"
              class="w-full min-h-[48px] bg-primary text-on-primary rounded-lg text-label-md font-bold flex items-center justify-center gap-2 hover:opacity-90 disabled:opacity-60 transition">
        <span id="submitLabel">Update Password</span>
        <span class="material-symbols-outlined" style="font-size:20px">arrow_forward</span>
      </button>
    </form>

    <div class="mt-8 text-center text-body-md text-on-surface-variant border-t border-surface-variant pt-6">
      <a class="text-primary font-bold hover:underline" href="/login">Back to sign in</a>
    </div>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  if (!token) {
    $('noToken').classList.remove('hidden');
    $('resetForm').classList.add('opacity-50', 'pointer-events-none');
  }

  // Generic password show/hide for any data-pw-toggle button on the page
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-pw-toggle]');
    if (!btn) return;
    const input = document.getElementById(btn.dataset.pwToggle);
    const icon  = btn.querySelector('.pw-icon');
    if (!input) return;
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    if (icon) icon.textContent = showing ? 'visibility' : 'visibility_off';
    btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });

  const showErr = m => { $('successMsg').classList.add('hidden'); $('errorMsg').textContent = m; $('errorMsg').classList.remove('hidden'); };
  const showOk  = m => { $('errorMsg').classList.add('hidden');   $('successMsg').textContent = m; $('successMsg').classList.remove('hidden'); };

  $('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const np = $('newPassword').value;
    const cp = $('confirmPassword').value;
    if (!np || !cp) return showErr('Please fill both fields.');
    if (np !== cp) return showErr('Passwords do not match.');
    if (np.length < 8 || !/[A-Za-z]/.test(np) || !/\d/.test(np)) {
      return showErr('Password must be at least 8 characters and include a letter and a number.');
    }

    const btn = $('submitBtn');
    btn.disabled = true;
    $('submitLabel').textContent = 'Updating...';
    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: np })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Could not reset password.');
      showOk(data.message + ' Redirecting...');
      setTimeout(() => { window.location.href = '/login'; }, 1500);
    } catch (err) {
      showErr(err.message);
    } finally {
      btn.disabled = false;
      $('submitLabel').textContent = 'Update Password';
    }
  });
</script>
</body>
</html>
