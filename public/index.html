<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>GED Math Master</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/theme.js"></script>
<style>body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
  <div class="absolute inset-0 pointer-events-none opacity-30">
    <div class="w-[800px] h-[800px] rounded-full bg-gradient-to-tr from-primary-fixed-dim/30 to-transparent blur-3xl absolute -top-[200px] -left-[200px]"></div>
    <div class="w-[600px] h-[600px] rounded-full bg-gradient-to-bl from-secondary-container/40 to-transparent blur-3xl absolute -bottom-[100px] -right-[100px]"></div>
  </div>

  <main class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-lg p-8 md:p-10 relative z-10">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-primary-container/10 mb-4">
        <span class="material-symbols-outlined text-primary" style="font-size:32px">menu_book</span>
      </div>
      <h1 class="text-headline-lg font-headline-lg text-primary mb-2">GED Math Master</h1>
      <p class="text-body-md text-on-surface-variant">AI-powered GED Mathematical Reasoning practice, grounded in the official study guide.</p>
    </div>

    <div class="space-y-3">
      <button onclick="window.location.href='/login.html'"
              class="w-full h-12 bg-primary text-on-primary rounded-lg font-bold text-label-md flex items-center justify-center gap-2 hover:opacity-90">
        Sign In
        <span class="material-symbols-outlined" style="font-size:20px">arrow_forward</span>
      </button>

      <button onclick="window.location.href='/create_account.html'"
              class="w-full h-12 bg-surface-container-low text-on-surface rounded-lg font-bold text-label-md hover:bg-surface-container">
        Create Account
      </button>

      <div class="flex items-center gap-3 my-2">
        <div class="flex-1 h-px bg-outline-variant"></div>
        <span class="text-label-md text-on-surface-variant">or</span>
        <div class="flex-1 h-px bg-outline-variant"></div>
      </div>

      <button id="guestBtn"
              class="w-full h-12 border border-outline-variant text-on-surface-variant rounded-lg font-bold text-label-md hover:bg-surface-container-low flex items-center justify-center gap-2">
        <span class="material-symbols-outlined" style="font-size:20px">play_arrow</span>
        Try as Guest
      </button>
      <p class="text-[12px] text-on-surface-variant text-center">Guests get 20 practice questions/hour. No progress saved.</p>
    </div>
  </main>

<script>
  document.getElementById('guestBtn').addEventListener('click', () => {
    sessionStorage.setItem('ged_guest', 'true');
    window.location.href = '/practice_session.html';
  });
  if (localStorage.getItem('ged_access_token')) window.location.href = '/dashboard.html';
</script>
</body>
</html>
