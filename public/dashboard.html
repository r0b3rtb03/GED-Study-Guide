<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>Dashboard — GED Study Guide</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/theme.js"></script>
<style>body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}</style>
</head>
<body class="bg-background text-on-surface min-h-screen">
  <main class="md:pl-64 pt-16 md:pt-0 pb-20 md:pb-0">
    <div class="max-w-[1200px] mx-auto p-margin-mobile md:p-margin-desktop">
      <header class="mb-8">
        <h1 class="text-headline-lg font-headline-lg" id="welcomeHeader">Welcome back</h1>
        <p class="text-body-md text-on-surface-variant mt-1">Here's a snapshot of your GED progress.</p>
        <div id="encouragement" class="mt-4 hidden p-4 bg-primary-container/10 border-l-4 border-primary rounded-r-lg">
          <p class="text-body-md text-on-surface flex items-start gap-2">
            <span class="material-symbols-outlined text-primary shrink-0" style="font-size:22px">favorite</span>
            <span id="encouragementText"></span>
          </p>
        </div>
      </header>

      <section id="statsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-gutter mb-8">
        <!-- stat cards injected here -->
      </section>

      <section id="recommendedReviewSection" class="mb-8 hidden">
        <h2 class="text-headline-md font-headline-md mb-4 flex items-center gap-2">
          <span class="material-symbols-outlined text-primary" style="font-size:24px">auto_stories</span>
          Recommended Review
        </h2>
        <div id="recommendedReview" class="space-y-3"></div>
      </section>

      <section class="mb-8">
        <h2 class="text-headline-md font-headline-md mb-4">Topic Progress</h2>
        <div id="topicProgress" class="space-y-4"></div>
      </section>

      <section>
        <h2 class="text-headline-md font-headline-md mb-4">Quick Start</h2>
        <div id="quickStart" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-gutter"></div>
      </section>
    </div>
  </main>

<script type="module">
  import { renderShell } from '/js/layout.js';
  import { apiJson, getUser } from '/js/auth.js';
  import { randomEncouragement } from '/js/encouragement.js';

  renderShell({ active: 'dashboard' });

  // Topic icons by slug (across all subjects). The actual topic list comes
  // from /api/user/stats → bySubject so the dashboard always reflects the
  // current backend configuration.
  const TOPIC_ICONS = {
    'algebra': 'function',
    'linear-equations': 'show_chart',
    'fractions': 'percent',
    'geometry': 'square_foot',
    'stats': 'bar_chart',
    'civics-government': 'gavel',
    'us-history': 'flag',
    'economics': 'payments',
    'geography': 'public',
    'world-history': 'history_edu'
  };
  const SUBJECT_ICONS = { 'math': 'function', 'social-studies': 'public' };

  const user = getUser();
  if (user?.firstName) document.getElementById('welcomeHeader').textContent = `Welcome back, ${user.firstName}`;

  // Random encouragement message — runs once per dashboard load.
  const encEl = document.getElementById('encouragement');
  const encText = document.getElementById('encouragementText');
  if (encEl && encText) {
    encText.textContent = randomEncouragement(user?.firstName);
    encEl.classList.remove('hidden');
  }

  function scoreColor(pct) {
    if (pct >= 80) return 'text-[#10b981]';
    if (pct >= 60) return 'text-[#f59e0b]';
    if (pct > 0)   return 'text-error';
    return 'text-on-surface-variant';
  }
  function barColor(pct) {
    if (pct >= 80) return 'bg-[#10b981]';
    if (pct >= 60) return 'bg-[#f59e0b]';
    if (pct > 0)   return 'bg-error';
    return 'bg-outline-variant';
  }

  function statCard(label, value, suffix, icon, color = 'text-primary') {
    return `<div class="bg-surface-container-lowest rounded-xl p-5 border border-outline-variant/40">
      <div class="flex items-center justify-between mb-3">
        <span class="text-label-md text-on-surface-variant">${label}</span>
        <span class="material-symbols-outlined ${color}" style="font-size:22px">${icon}</span>
      </div>
      <div class="flex items-baseline gap-1">
        <span class="text-metric-display font-metric-display ${color}">${value}</span>
        <span class="text-body-md text-on-surface-variant">${suffix || ''}</span>
      </div>
    </div>`;
  }

  function renderSubjectProgress(bySubject) {
    // Render one block per subject, each with its topics inside.
    const subjects = Object.values(bySubject || {});
    if (!subjects.length) return '<p class="text-on-surface-variant text-label-md">No subjects configured.</p>';
    return subjects.map(sub => {
      const topicRows = Object.entries(sub.topics).map(([slug, data]) => {
        const icon = TOPIC_ICONS[slug] || 'category';
        return `<div class="flex items-center gap-4">
          <div class="w-9 h-9 rounded-lg bg-primary-container/10 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-primary" style="font-size:20px">${icon}</span>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <p class="text-label-md font-label-md truncate">${data.name || slug}</p>
              <p class="text-label-md font-bold ${scoreColor(data.percent)}">${data.percent}%</p>
            </div>
            <div class="w-full h-2 bg-surface-container rounded-full overflow-hidden">
              <div class="h-full ${barColor(data.percent)} transition-all" style="width:${data.percent}%"></div>
            </div>
          </div>
        </div>`;
      }).join('');
      const subjIcon = SUBJECT_ICONS[sub.slug] || 'school';
      return `<section class="bg-surface-container-lowest rounded-xl border border-outline-variant/40 p-5">
        <header class="flex items-center justify-between gap-3 mb-4">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary" style="font-size:22px">${subjIcon}</span>
            <h3 class="text-headline-sm font-headline-sm">${sub.name}</h3>
            <span class="text-label-md text-on-surface-variant">· ${sub.sessions} session${sub.sessions === 1 ? '' : 's'}</span>
          </div>
          <p class="text-label-md font-bold ${scoreColor(sub.percent)}">${sub.percent}% overall</p>
        </header>
        <div class="space-y-3">${topicRows}</div>
      </section>`;
    }).join('');
  }

  function renderRecommendedReview(weakTopics) {
    const section = document.getElementById('recommendedReviewSection');
    const container = document.getElementById('recommendedReview');
    if (!weakTopics.length) { section.classList.add('hidden'); return; }
    section.classList.remove('hidden');
    container.innerHTML = weakTopics.map(w => `
      <article class="bg-surface-container-lowest rounded-xl p-5 border border-outline-variant/40 flex flex-col md:flex-row md:items-center gap-4">
        <div class="w-12 h-12 rounded-lg bg-error-container/60 flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-error" style="font-size:24px">priority_high</span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <p class="text-headline-sm font-headline-sm">${w.name}</p>
            ${w.subjectName ? `<span class="text-label-md text-on-surface-variant px-2 h-5 rounded-full bg-surface-container">${w.subjectName}</span>` : ''}
          </div>
          <p class="text-body-md text-on-surface-variant mt-1">${w.recommendation}</p>
          <p class="text-label-md text-on-surface-variant mt-1">Current accuracy: <span class="font-bold text-error">${w.percent}%</span> across ${w.attempts} questions</p>
        </div>
        <div class="flex flex-col sm:flex-row gap-2 shrink-0">
          <a href="${w.pdfHref}" target="_blank" rel="noopener" class="inline-flex items-center justify-center gap-1.5 h-10 px-4 rounded-lg bg-primary text-on-primary font-bold text-label-md hover:opacity-90">
            <span class="material-symbols-outlined" style="font-size:18px">auto_stories</span>
            Open Study Guide
          </a>
          <a href="/practice_session?subject=${w.subject || 'math'}&topic=${w.slug}" class="inline-flex items-center justify-center gap-1.5 h-10 px-4 rounded-lg ring-1 ring-outline-variant text-on-surface font-bold text-label-md hover:bg-surface-container-low">
            <span class="material-symbols-outlined" style="font-size:18px">edit_square</span>
            Practice
          </a>
        </div>
      </article>
    `).join('');
  }

  function renderQuickStart(bySubject) {
    // Quick start: one card per subject — clicking takes user to the practice
    // chooser with the subject pre-selected (they still pick difficulty +
    // topic there).
    const subjects = Object.values(bySubject || {});
    return subjects.map(sub => `
      <a href="/practice_session?subject=${sub.slug}" class="group bg-surface-container-lowest rounded-xl p-5 border border-outline-variant/40 hover:border-primary hover:shadow-md transition flex flex-col gap-3">
        <div class="w-12 h-12 rounded-lg bg-primary-container/10 flex items-center justify-center">
          <span class="material-symbols-outlined text-primary" style="font-size:26px">${SUBJECT_ICONS[sub.slug] || 'school'}</span>
        </div>
        <div>
          <p class="text-headline-sm font-headline-sm">${sub.name}</p>
          <p class="text-label-md text-on-surface-variant mt-1">${Object.keys(sub.topics).length} topics · 10 questions per session</p>
        </div>
        <div class="mt-auto text-primary text-label-md font-bold flex items-center gap-1 group-hover:gap-2 transition-all">
          Practice now <span class="material-symbols-outlined" style="font-size:18px">arrow_forward</span>
        </div>
      </a>`).join('');
  }

  (async () => {
    try {
      const stats = await apiJson('/api/user/stats');
      const overallColor = stats.overallScore >= 80 ? 'text-[#10b981]' : stats.overallScore >= 60 ? 'text-[#f59e0b]' : 'text-primary';
      document.getElementById('statsGrid').innerHTML = [
        statCard('Overall Score', stats.overallScore, '%', 'school', overallColor),
        statCard('Time Studied', stats.totalTimeMinutes, 'min', 'schedule'),
        statCard('Sessions', stats.sessionsCompleted, '', 'edit_square'),
        statCard('Current Streak', stats.streakDays, 'days', 'local_fire_department', 'text-[#f59e0b]')
      ].join('');
      document.getElementById('topicProgress').innerHTML = renderSubjectProgress(stats.bySubject || {});
      renderRecommendedReview(stats.weakTopics || []);
      document.getElementById('quickStart').innerHTML = renderQuickStart(stats.bySubject || {});
    } catch (e) {
      document.getElementById('statsGrid').innerHTML = `<div class="col-span-full text-error text-label-md">${e.message}</div>`;
      document.getElementById('topicProgress').innerHTML = '';
    }
  })();
</script>
</body>
</html>
