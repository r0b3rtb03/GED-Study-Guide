<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/favicon.png" />
<title>Dashboard — GED Study Guide</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/theme.js"></script>
<style>
  body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  .circular-chart { display: block; }
  .circle-bg { fill: none; stroke: rgba(115, 119, 128, 0.18); stroke-width: 3.4; }
  .circle    { fill: none; stroke-width: 3.2; stroke-linecap: round; animation: progress 1s ease-out forwards; }
  @keyframes progress { 0% { stroke-dasharray: 0 100; } }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen">
  <main class="md:pl-64 pt-16 md:pt-0 pb-20 md:pb-0">
    <div class="max-w-[1200px] mx-auto p-margin-mobile md:p-margin-desktop space-y-8">

      <!-- Welcome banner: date + serif greeting + inspirational quote -->
      <section class="border-b border-outline-variant/40 pb-6">
        <p id="welcomeDate" class="text-label-md font-bold text-on-surface-variant uppercase tracking-[0.1em] mb-2"></p>
        <h1 id="welcomeHeader" class="text-[36px] md:text-[48px] leading-tight font-bold text-primary mb-2">Welcome back.</h1>
        <p id="welcomeQuote" class="text-body-lg text-on-surface-variant max-w-2xl"></p>
      </section>

      <section id="statsGrid" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></section>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1 flex flex-col gap-8">
          <section id="recommendedReviewSection" class="hidden">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-headline-md font-bold text-primary">Priority Review</h2>
              <span id="prCount" class="bg-surface-container-high px-2 py-1 rounded text-[12px] font-bold text-on-surface-variant uppercase tracking-wider">0</span>
            </div>
            <!-- Filter controls. Sort dropdown picks ordering; pill row filters
                 by priority band, difficulty, or subject. Pills are mutually
                 exclusive within their row (single-select) but the rows
                 themselves combine — pick one priority + one difficulty +
                 one subject. -->
            <div id="prFilters" class="ged-glass rounded-xl p-3 mb-4 space-y-3">
              <div class="flex items-center justify-between gap-2">
                <p class="text-[11px] uppercase tracking-wider font-bold text-on-surface-variant">Sort by</p>
                <select id="prSort" class="h-8 px-2 rounded-lg ring-1 ring-outline-variant text-label-md bg-surface-container-lowest">
                  <option value="worst">Lowest score first</option>
                  <option value="best">Highest score first</option>
                  <option value="difficulty">Difficulty (Easy → Hard)</option>
                  <option value="subject">Subject (A → Z)</option>
                </select>
              </div>
              <div data-filter-row="priority"  class="flex flex-wrap gap-1.5"></div>
              <div data-filter-row="difficulty" class="flex flex-wrap gap-1.5"></div>
              <div data-filter-row="subject"    class="flex flex-wrap gap-1.5"></div>
            </div>
            <div id="recommendedReview" class="space-y-4"></div>
            <p id="prEmpty" class="hidden text-label-md text-on-surface-variant mt-2 text-center">No topics match these filters.</p>
          </section>
        </div>

        <div class="lg:col-span-2 flex flex-col gap-8">
          <section>
            <h2 class="text-headline-md font-bold text-primary mb-4">Quick Start</h2>
            <div id="quickStart" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
          </section>

          <section>
            <h2 class="text-headline-md font-bold text-primary mb-4">Detailed Progress</h2>
            <!-- 2-column grid on desktop: pairs of subjects sit side by side
                 so the user sees twice as much in the same vertical space.
                 Stacks on mobile where there isn't horizontal room. Each
                 subject card carries its own surface, so we don't need
                 dividers in the container itself. -->
            <div id="topicProgress" class="grid md:grid-cols-2 gap-gutter"></div>
          </section>
        </div>
      </div>

    </div>
  </main>

<script type="module">
  import { renderShell } from '/js/layout.js';
  import { apiJson, getUser } from '/js/auth.js';
  import { randomEncouragement } from '/js/encouragement.js';
  renderShell({ active: 'dashboard' });

  const TOPIC_ICONS = {
    'algebra': 'function', 'linear-equations': 'show_chart', 'fractions': 'percent',
    'geometry': 'square_foot', 'stats': 'bar_chart',
    'civics-government': 'gavel', 'us-history': 'flag', 'economics': 'payments',
    'geography': 'public', 'world-history': 'history_edu',
    'reading-comprehension': 'menu_book', 'grammar-and-usage': 'spellcheck',
    'vocabulary-in-context': 'translate', 'analyzing-arguments': 'forum',
    'writing-and-essay': 'edit_note',
    'life-science': 'biotech', 'physical-science': 'science',
    'earth-space-science': 'public', 'scientific-method': 'experiment',
    'data-interpretation': 'analytics'
  };
  const SUBJECT_META = {
    'math':           { icon: 'calculate', tile: 'bg-primary-container text-on-primary', tileCta: 'text-primary' },
    'social-studies': { icon: 'public',    tile: 'bg-[#003a3a] text-white',              tileCta: 'text-[#003a3a]' },
    'english':        { icon: 'menu_book', tile: 'bg-[#4a1f6b] text-white',              tileCta: 'text-[#4a1f6b]' },
    'science':        { icon: 'science',   tile: 'bg-[#6b2f1f] text-white',              tileCta: 'text-[#6b2f1f]' }
  };

  const user = getUser();
  if (user?.firstName) document.getElementById('welcomeHeader').textContent = `Welcome back, ${user.firstName}.`;
  document.getElementById('welcomeDate').textContent = new Date().toLocaleDateString('en-US',
    { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('welcomeQuote').textContent = randomEncouragement(user?.firstName);

  const scoreHex   = pct => pct >= 80 ? '#16a34a' : pct >= 60 ? '#ca8a04' : pct > 0 ? '#dc2626' : '#737780';
  const scoreLabel = pct => pct >= 80 ? 'Strong'  : pct >= 60 ? 'Solid'   : pct > 0 ? 'Needs Work' : 'Start Here';
  const scoreClass = pct =>
    pct >= 80 ? 'text-[#16a34a]' :
    pct >= 60 ? 'text-[#ca8a04]' :
    pct > 0   ? 'text-error'     : 'text-on-surface-variant';

  function overallCard(pct) {
    const color = scoreHex(pct);
    return `<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 shadow-sm flex items-center gap-4 col-span-2 lg:col-span-1">
      <div class="w-16 h-16 shrink-0 relative">
        <svg class="circular-chart w-full h-full" viewBox="0 0 36 36">
          <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          <path class="circle" stroke="${color}" stroke-dasharray="${pct}, 100"
                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
        </svg>
        <div class="absolute inset-0 flex items-center justify-center text-label-md font-bold" style="color:${color}">${pct}%</div>
      </div>
      <div class="min-w-0">
        <p class="text-[12px] font-bold text-on-surface-variant uppercase tracking-wider">Overall score</p>
        <p class="text-headline-md font-bold text-on-surface mt-1">${scoreLabel(pct)}</p>
      </div>
    </div>`;
  }
  function simpleStatCard(label, value, suffix, icon, accent = '') {
    return `<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 shadow-sm flex items-center justify-between">
      <div class="min-w-0">
        <p class="text-[12px] font-bold text-on-surface-variant uppercase tracking-wider">${label}</p>
        <p class="text-headline-md font-bold text-on-surface mt-1">
          ${value}<span class="text-body-md font-normal text-on-surface-variant ml-1">${suffix || ''}</span>
        </p>
      </div>
      <div class="w-10 h-10 rounded-lg ${accent || 'bg-surface-container-low text-primary'} flex items-center justify-center shrink-0">
        <span class="material-symbols-outlined" style="font-size:22px">${icon}</span>
      </div>
    </div>`;
  }

  // Priority badge logic — red (<60%) "Needs attention", orange (60-79%)
  // "Needs a refresher", green (>=80%) nothing. Returns HTML for the chip
  // (empty string if no chip is warranted).
  function priorityBadge(pct) {
    if (pct >= 80) return '';
    if (pct >= 60) return `<span class="bg-[#fef3c7] text-[#92400e] text-[11px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Needs a refresher</span>`;
    return `<span class="bg-[#fee2e2] text-[#991b1b] text-[11px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Needs attention</span>`;
  }

  // Subject pill palette — one swatch per subject; default to Math's if
  // we ever encounter a subject without a registered pill.
  const SUBJECT_PILL = {
    'math':           'bg-[#d3e4fe] text-[#1f477b]',
    'social-studies': 'bg-[#cde7e7] text-[#003a3a]',
    'english':        'bg-[#e9d8fd] text-[#4a1f6b]',
    'science':        'bg-[#fde2cf] text-[#6b2f1f]'
  };
  const SUBJECT_LABEL = {
    'math': 'Math', 'social-studies': 'Social Studies', 'english': 'English', 'science': 'Science'
  };
  function priorityCard(w) {
    const subjLabel = w.subjectName || SUBJECT_LABEL[w.subject] || 'Math';
    const subjPill  = SUBJECT_PILL[w.subject] || SUBJECT_PILL.math;
    const diff = w.difficulty || 'medium';
    const diffPill = diff === 'easy'
      ? 'bg-[#dcfce7] text-[#166534]'
      : diff === 'medium'
      ? 'bg-[#fef3c7] text-[#92400e]'
      : 'bg-[#fee2e2] text-[#991b1b]';
    const diffLabel = diff[0].toUpperCase() + diff.slice(1);
    const scoreTone = w.percent < 60 ? 'text-error' : 'text-[#92400e]';
    return `<article class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm overflow-hidden">
      <div class="p-4">
        <div class="flex items-center justify-between gap-2 mb-3 flex-wrap">
          <div class="flex items-center gap-1.5 flex-wrap">
            <span class="${subjPill} text-[11px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">${subjLabel}</span>
            <span class="${diffPill} text-[11px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">${diffLabel}</span>
            ${priorityBadge(w.percent)}
          </div>
          <span class="${scoreTone} text-label-md font-bold">${w.score}/${w.total} · ${w.percent}%</span>
        </div>
        <h4 class="text-headline-md font-bold text-on-surface mb-1">${w.name}</h4>
        <p class="text-body-md text-on-surface-variant">${w.recommendation}</p>
      </div>
      <div class="bg-surface-container-low p-3 grid grid-cols-3 gap-2">
        <a href="/study_notes?topic=${w.slug}" class="text-center bg-surface-container-lowest border border-outline-variant text-on-surface hover:bg-surface-container py-2 rounded text-label-md font-bold transition-colors">Study Notes</a>
        <a href="${w.pdfHref}" target="_blank" rel="noopener" class="text-center bg-surface-container-lowest border border-outline-variant text-on-surface hover:bg-surface-container py-2 rounded text-label-md font-bold transition-colors">Study Guide</a>
        <a href="/practice_session?subject=${w.subject || 'math'}&topic=${w.slug}" class="text-center bg-primary text-on-primary hover:opacity-90 py-2 rounded text-label-md font-bold transition-colors">Practice</a>
      </div>
    </article>`;
  }

  function quickStartTile(sub) {
    const meta = SUBJECT_META[sub.slug] || { icon: 'school', tile: 'bg-primary-container text-on-primary', tileCta: 'text-primary' };
    const sessionsText = sub.sessions === 0
      ? 'Start your first session.'
      : `Pick up where you left off · ${sub.percent}% overall`;
    return `<a href="/practice_session?subject=${sub.slug}" class="${meta.tile} p-6 rounded-xl flex flex-col relative overflow-hidden group cursor-pointer border border-transparent hover:border-outline-variant transition-colors">
      <div class="absolute -right-4 -top-4 opacity-10 pointer-events-none">
        <span class="material-symbols-outlined" style="font-size:120px">${meta.icon}</span>
      </div>
      <h3 class="text-headline-lg font-bold mb-1 relative z-10">${sub.name}</h3>
      <p class="text-body-md mb-6 relative z-10 opacity-90">${sessionsText}</p>
      <span class="mt-auto self-start bg-surface-container-lowest ${meta.tileCta} px-6 py-2 rounded shadow text-label-md font-bold relative z-10 group-hover:bg-surface-container-low transition-colors">Practice Now</span>
    </a>`;
  }

  function diffPill(label, d) {
    const attempted = d.total > 0;
    const tone = attempted ? scoreClass(d.percent) : 'text-on-surface-variant/60';
    const txt = attempted ? `${d.score}/${d.total}` : 'not attempted';
    return `<span class="${tone} text-[11px] font-bold">${label} ${txt}</span>`;
  }
  function renderTopicProgress(bySubject) {
    const subjects = Object.values(bySubject || {});
    if (!subjects.length) return '<p class="p-6 text-on-surface-variant text-label-md">No subjects configured.</p>';
    return subjects.map(sub => {
      const subjMeta = SUBJECT_META[sub.slug] || { icon: 'school' };
      const rows = Object.entries(sub.topics).map(([slug, data]) => {
        const icon = TOPIC_ICONS[slug] || 'category';
        const bd = data.byDifficulty || { easy:{total:0,percent:0,score:0}, medium:{total:0,percent:0,score:0}, hard:{total:0,percent:0,score:0} };
        return `<div class="space-y-1.5">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-on-surface-variant shrink-0" style="font-size:18px">${icon}</span>
            <span class="text-body-md text-on-surface truncate flex-1 min-w-0">${data.name || slug}</span>
            <span class="text-label-md font-bold ${scoreClass(data.percent)} w-12 text-right">${data.percent}%</span>
          </div>
          <div class="ml-7 mr-14 h-2 bg-surface-container rounded-full overflow-hidden">
            <div class="h-full rounded-full transition-all" style="width:${data.percent}%; background:${scoreHex(data.percent)}"></div>
          </div>
          <div class="ml-7 flex flex-wrap gap-x-3 gap-y-1">
            ${diffPill('Easy',   bd.easy)}
            ${diffPill('Medium', bd.medium)}
            ${diffPill('Hard',   bd.hard)}
          </div>
        </div>`;
      }).join('');
      return `<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm p-6">
        <header class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-primary-container/15 text-primary flex items-center justify-center">
              <span class="material-symbols-outlined">${subjMeta.icon}</span>
            </div>
            <div>
              <h3 class="text-headline-md font-bold text-on-surface">${sub.name}</h3>
              <p class="text-[12px] text-on-surface-variant">${sub.percent}% overall · ${sub.sessions} session${sub.sessions === 1 ? '' : 's'}</p>
            </div>
          </div>
        </header>
        <div class="space-y-4">${rows}</div>
      </div>`;
    }).join('');
  }
  // ---- Priority Review filtering ----
  // All raw weak attempts kept here; the filter pills + sort dropdown derive
  // the visible subset on every interaction. Single-select per row, 'all'
  // means "no filter on this dimension".
  const prState = { sort: 'worst', priority: 'all', difficulty: 'all', subject: 'all', all: [] };

  function priorityBand(pct) {
    if (pct < 60) return 'attention';
    if (pct < 80) return 'refresher';
    return 'mastered';
  }

  function pillButton(active, label, value, row) {
    return `<button data-row="${row}" data-value="${value}" class="h-7 px-2.5 rounded-full text-[11px] font-bold uppercase tracking-wider transition ${active ? 'bg-primary text-on-primary' : 'bg-surface-container text-on-surface-variant hover:bg-surface-container-high'}">${label}</button>`;
  }

  function renderFilterPills() {
    // Derive subject options from the actual data so we never show a filter
    // that would match zero items.
    const subjects = [...new Set(prState.all.map(w => w.subject))];
    const subjectLabel = (slug) => slug === 'social-studies' ? 'Social Studies' : 'Math';

    document.querySelector('[data-filter-row="priority"]').innerHTML = [
      pillButton(prState.priority === 'all',       'All',       'all',       'priority'),
      pillButton(prState.priority === 'attention', 'Needs attention',  'attention', 'priority'),
      pillButton(prState.priority === 'refresher', 'Needs a refresher','refresher', 'priority')
    ].join('');

    document.querySelector('[data-filter-row="difficulty"]').innerHTML = [
      pillButton(prState.difficulty === 'all',    'Any difficulty', 'all',    'difficulty'),
      pillButton(prState.difficulty === 'easy',   'Easy',           'easy',   'difficulty'),
      pillButton(prState.difficulty === 'medium', 'Medium',         'medium', 'difficulty'),
      pillButton(prState.difficulty === 'hard',   'Hard',           'hard',   'difficulty')
    ].join('');

    const subjectRow = document.querySelector('[data-filter-row="subject"]');
    if (subjects.length <= 1) {
      // Only one subject is represented — hide the row entirely; a single-
      // option filter is just noise.
      subjectRow.innerHTML = '';
    } else {
      subjectRow.innerHTML = [
        pillButton(prState.subject === 'all', 'All subjects', 'all', 'subject'),
        ...subjects.map(s => pillButton(prState.subject === s, subjectLabel(s), s, 'subject'))
      ].join('');
    }
  }

  function sortAttempts(list) {
    const diffOrder = { easy: 0, medium: 1, hard: 2 };
    const arr = [...list];
    switch (prState.sort) {
      case 'best':       arr.sort((a, b) => b.percent - a.percent); break;
      case 'difficulty': arr.sort((a, b) => (diffOrder[a.difficulty] ?? 99) - (diffOrder[b.difficulty] ?? 99) || a.percent - b.percent); break;
      case 'subject':    arr.sort((a, b) => (a.subjectName || a.subject).localeCompare(b.subjectName || b.subject) || a.percent - b.percent); break;
      case 'worst':
      default:           arr.sort((a, b) => a.percent - b.percent); break;
    }
    return arr;
  }

  function applyFilters() {
    let list = prState.all;
    if (prState.priority   !== 'all') list = list.filter(w => priorityBand(w.percent) === prState.priority);
    if (prState.difficulty !== 'all') list = list.filter(w => (w.difficulty || 'medium') === prState.difficulty);
    if (prState.subject    !== 'all') list = list.filter(w => w.subject === prState.subject);
    return sortAttempts(list);
  }

  function renderPriorityCards() {
    const container = document.getElementById('recommendedReview');
    const empty     = document.getElementById('prEmpty');
    const visible   = applyFilters();
    document.getElementById('prCount').textContent = `${visible.length} of ${prState.all.length}`;
    container.innerHTML = visible.map(priorityCard).join('');
    empty.classList.toggle('hidden', visible.length > 0);
  }

  function renderRecommendedReview(weakTopics) {
    const section = document.getElementById('recommendedReviewSection');
    if (!weakTopics.length) { section.classList.add('hidden'); return; }
    section.classList.remove('hidden');
    prState.all = weakTopics;
    renderFilterPills();
    renderPriorityCards();
  }

  // Wire filter interactions (event delegation — pills are re-rendered on
  // every selection so direct listeners would go stale).
  document.getElementById('prFilters').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-row]');
    if (!btn) return;
    prState[btn.dataset.row] = btn.dataset.value;
    renderFilterPills();
    renderPriorityCards();
  });
  document.getElementById('prSort').addEventListener('change', (e) => {
    prState.sort = e.target.value;
    renderPriorityCards();
  });
  function renderQuickStart(bySubject) {
    const subjects = Object.values(bySubject || {});
    document.getElementById('quickStart').innerHTML = subjects.map(quickStartTile).join('');
  }

  (async () => {
    try {
      const stats = await apiJson('/api/user/stats');
      const streakAccent = stats.streakDays > 0 ? 'bg-error-container text-on-error-container' : '';
      document.getElementById('statsGrid').innerHTML = [
        overallCard(stats.overallScore),
        simpleStatCard('Time Studied',  stats.totalTimeMinutes, 'min', 'schedule'),
        simpleStatCard('Sessions',      stats.sessionsCompleted, '',   'history_edu'),
        simpleStatCard('Current Streak', stats.streakDays, stats.streakDays === 1 ? 'day' : 'days', 'local_fire_department', streakAccent)
      ].join('');
      document.getElementById('topicProgress').innerHTML = renderTopicProgress(stats.bySubject || {});
      renderRecommendedReview(stats.weakAttempts || stats.weakTopics || []);
      renderQuickStart(stats.bySubject || {});
    } catch (e) {
      document.getElementById('statsGrid').innerHTML = `<div class="col-span-full text-error text-label-md">${e.message}</div>`;
    }
  })();
</script>
</body>
</html>
