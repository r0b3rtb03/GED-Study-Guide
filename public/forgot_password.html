<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/favicon.png" />
<title>Forgot Password — GED Study Guide</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css?v=3" />
<script src="/js/theme.js"></script>
<script src="/js/theme-toggle-floating.js" defer></script>
<style>body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
  <main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-lg p-8 md:p-10">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-container/10 mb-4">
        <span class="material-symbols-outlined text-primary" style="font-size:28px">lock_reset</span>
      </div>
      <h1 class="text-headline-md font-headline-md mb-2">Forgot password</h1>
      <p class="text-body-md text-on-surface-variant">Enter your email and we'll send you a link to reset it.</p>
    </div>

    <form id="forgotForm" class="space-y-4" novalidate>
      <div class="space-y-2">
        <label class="block text-label-md font-label-md" for="emailInput">Email Address</label>
        <div class="relative">
          <span class="material-symbols-outlined text-outline-variant absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">mail</span>
          <input id="emailInput" type="email" autocomplete="email" placeholder="you@example.com" required
                 class="w-full pl-11 pr-4 py-3 bg-surface rounded-lg text-body-md outline-none ring-1 ring-outline-variant focus:ring-2 focus:ring-primary transition" />
        </div>
      </div>

      <p id="errorMsg" class="text-error text-label-md hidden"></p>
      <p id="successMsg" class="text-[#047857] text-label-md hidden"></p>

      <button id="submitBtn" type="submit"
              class="w-full min-h-[48px] bg-primary text-on-primary rounded-lg text-label-md font-bold flex items-center justify-center gap-2 hover:opacity-90 disabled:opacity-60 transition">
        <span id="submitLabel">Send Reset Link</span>
        <span class="material-symbols-outlined" style="font-size:20px">arrow_forward</span>
      </button>
    </form>

    <div id="devLinkBox" class="hidden mt-4 p-3 rounded-lg bg-secondary-container/40 text-on-secondary-container text-label-md">
      <strong>Dev mode:</strong> SMTP not configured.<br>
      <a id="devLink" target="_blank" rel="noopener" class="text-primary underline break-all"></a>
    </div>

    <div class="mt-8 text-center text-body-md text-on-surface-variant border-t border-surface-variant pt-6">
      Remembered it?
      <a class="text-primary font-bold hover:underline ml-1" href="/login">Back to sign in</a>
    </div>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const showErr = m => { $('successMsg').classList.add('hidden'); $('errorMsg').textContent = m; $('errorMsg').classList.remove('hidden'); };
  const showOk  = m => { $('errorMsg').classList.add('hidden');   $('successMsg').textContent = m; $('successMsg').classList.remove('hidden'); };

  $('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('emailInput').value.trim();
    if (!email) return showErr('Please enter your email.');
    if (!/\S+@\S+\.\S+/.test(email)) return showErr('Invalid email address.');

    const btn = $('submitBtn');
    btn.disabled = true;
    $('submitLabel').textContent = 'Sending...';
    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Could not send reset link.');
      showOk(data.message || 'If an account exists for that email, a reset link has been sent.');
      if (data.devResetUrl) {
        $('devLinkBox').classList.remove('hidden');
        $('devLink').href = data.devResetUrl;
        $('devLink').textContent = data.devResetUrl;
      }
    } catch (err) {
      showErr(err.message);
    } finally {
      btn.disabled = false;
      $('submitLabel').textContent = 'Send Reset Link';
    }
  });
</script>
</body>
</html>
