<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/favicon.png" />
<title>Study Guide — GED</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<script src="/js/theme.js"></script>
<style>body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}</style>
</head>
<body class="bg-background text-on-surface h-screen overflow-hidden">
  <main id="viewerHost" class="h-screen flex flex-col">
    <!-- Toolbar with subject tabs + actions -->
    <header class="shrink-0 bg-surface-container-lowest border-b border-outline-variant">
      <div class="flex items-center justify-between gap-3 px-4 h-12">
        <div class="flex items-center gap-2 min-w-0">
          <span class="material-symbols-outlined text-primary" style="font-size:20px">auto_stories</span>
          <p class="text-label-md font-bold text-on-surface truncate">GED Study Guide</p>
        </div>
        <div class="flex items-center gap-1">
          <a id="downloadLink" href="/study-guide.pdf" download class="hidden sm:inline-flex items-center gap-1.5 h-8 px-3 rounded-lg text-label-md font-bold text-on-surface-variant hover:bg-surface-container-low">
            <span class="material-symbols-outlined" style="font-size:18px">download</span>
            Download
          </a>
          <a id="openTabLink" href="/study-guide.pdf" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 h-8 px-3 rounded-lg text-label-md font-bold text-on-surface-variant hover:bg-surface-container-low" aria-label="Open in new tab">
            <span class="material-symbols-outlined" style="font-size:18px">open_in_new</span>
            <span class="hidden sm:inline">Open in tab</span>
          </a>
        </div>
      </div>
      <!-- Subject tabs -->
      <div id="subjectTabs" class="flex gap-1 px-2 pb-2 overflow-x-auto"></div>
    </header>

    <!-- PDF iframe — fills the rest of the viewport -->
    <iframe id="pdfFrame" src="" title="GED Study Guide" class="flex-1 w-full border-0 bg-white"></iframe>
  </main>

<script type="module">
  import { renderShell } from '/js/dist/layout.js';
  import { getAccessToken, isGuest } from '/js/dist/auth.js';

  // Open viewer: works for both authed users and guests.
  // Authed users get the full sidebar shell; guests get a minimal top bar.
  const guest = !getAccessToken();
  const host  = document.getElementById('viewerHost');
  if (guest) {
    // Public top bar — matches the homepage marketing nav so guests have
    // a consistent path between landing → study guides → sign up.
    const guestBar = document.createElement('header');
    guestBar.className = 'shrink-0 h-16 bg-background border-b border-outline-variant flex items-center justify-between px-4 md:px-10';
    guestBar.innerHTML = `
      <a href="/" class="flex items-center gap-2">
        <img src="/logo.png" alt="GED Study Guide" class="w-9 h-9 rounded-lg object-contain"
             onerror="this.outerHTML='<span class=&quot;material-symbols-outlined text-primary&quot; style=&quot;font-size:28px&quot;>menu_book</span>'">
        <span class="font-bold text-headline-sm text-primary hidden sm:inline" style="font-family:'Source Serif 4',Georgia,serif">GED Study Guide</span>
      </a>
      <nav class="hidden md:flex items-center gap-7 text-body-md">
        <a href="/" class="text-on-surface-variant hover:text-primary transition-colors">Home</a>
        <a href="/#mission" class="text-on-surface-variant hover:text-primary transition-colors">About</a>
        <a href="/study_guide" class="text-primary font-bold border-b-2 border-primary pb-1">Study Guides</a>
      </nav>
      <div class="flex items-center gap-2">
        <a href="/login" class="inline-flex items-center h-9 px-4 rounded-lg text-label-md font-bold text-on-surface-variant hover:bg-surface-container-low">Log in</a>
        <a href="/create_account" class="inline-flex items-center h-9 px-4 rounded-lg text-label-md font-bold bg-primary text-on-primary hover:opacity-90">Sign up</a>
      </div>`;
    host.prepend(guestBar);
  } else {
    // Authed shell: side nav + mobile top bar. Re-add layout offsets.
    host.classList.add('pt-16', 'md:pt-0', 'md:pl-64');
    renderShell({ active: 'study_guide' });
  }

  const $ = id => document.getElementById(id);
  const SUBJECTS_DEFAULT = [
    { slug: 'math',            name: 'Math',                pdfPath: '/study-guide.pdf',           icon: 'function' },
    { slug: 'social-studies',  name: 'Social Studies',      pdfPath: '/social-studies-guide.pdf',  icon: 'public' },
    { slug: 'english',         name: 'English',             pdfPath: '/english-guide.pdf',         icon: 'menu_book' },
    { slug: 'science',         name: 'Science',             pdfPath: '/science-guide.pdf',         icon: 'science' },
    // Supplementary math references — show up after the four main subjects.
    { slug: 'formula-sheet',   name: 'Math Formula Sheet',  pdfPath: '/math-formula-sheet.pdf',    icon: 'functions' },
    { slug: 'no-calc-tips',    name: 'No-Calculator Tips',  pdfPath: '/non-calculator-tips.pdf',   icon: 'do_not_disturb_on' }
  ];

  // Initial subject from ?subject= URL param, else from sessionStorage, else math.
  const params = new URLSearchParams(location.search);
  const initialSlug = params.get('subject')
                    || sessionStorage.getItem('ged_last_study_guide_subject')
                    || 'math';

  // Supplementary references that are NOT registered subjects — kept here
  // so the catalog API response doesn't drop them.
  const EXTRAS = SUBJECTS_DEFAULT.filter(s => !['math','social-studies','english','science'].includes(s.slug));

  let SUBJECTS = SUBJECTS_DEFAULT;
  fetch('/api/user/catalog').then(r => r.ok ? r.json() : null).then(d => {
    if (d?.subjects?.length) {
      SUBJECTS = [
        ...d.subjects.map(s => ({ slug: s.slug, name: s.name, pdfPath: s.pdfPath, icon: s.icon })),
        ...EXTRAS
      ];
      renderTabs(currentSlug);
    }
  }).catch(() => { /* fall back to defaults */ });

  let currentSlug = initialSlug;

  function loadSubject(slug) {
    const s = SUBJECTS.find(x => x.slug === slug);
    if (!s) return;
    currentSlug = slug;
    sessionStorage.setItem('ged_last_study_guide_subject', slug);
    document.title = `${s.name} Study Guide — GED`;
    $('pdfFrame').src      = `${s.pdfPath}#toolbar=1&navpanes=1&view=FitH`;
    $('downloadLink').href = s.pdfPath;
    $('openTabLink').href  = s.pdfPath;
    renderTabs(slug);
  }

  function renderTabs(activeSlug) {
    $('subjectTabs').innerHTML = SUBJECTS.map(s => {
      const a = s.slug === activeSlug;
      return `<button data-subject="${s.slug}" class="inline-flex items-center gap-1.5 h-9 px-3 rounded-full text-label-md font-bold whitespace-nowrap transition ${a ? 'bg-primary text-on-primary' : 'text-on-surface-variant hover:bg-surface-container-low'}">
        <span class="material-symbols-outlined" style="font-size:18px">${s.icon}</span>
        ${s.name}
      </button>`;
    }).join('');
  }

  $('subjectTabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-subject]');
    if (b) loadSubject(b.dataset.subject);
  });

  loadSubject(initialSlug);
</script>
</body>
</html>
