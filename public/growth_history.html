<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/favicon.png" />
<title>Growth History — GED Study Guide</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<script src="/js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}</style>
</head>
<body class="bg-background text-on-surface min-h-screen">
  <main class="md:pl-64 pt-16 md:pt-0 pb-20 md:pb-0">
    <div class="max-w-[1280px] mx-auto p-margin-mobile md:p-margin-desktop">
      <header class="mb-6">
        <h1 class="text-headline-lg font-headline-lg">Growth History</h1>
        <p class="text-body-md text-on-surface-variant mt-1">See how your performance trends over time.</p>
      </header>

      <!-- Stat cards -->
      <section id="statsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-gutter mb-6"></section>

      <!-- Chart + Subject Mastery -->
      <div class="grid lg:grid-cols-[1fr_360px] gap-gutter mb-6">
        <section class="bg-surface-container-lowest rounded-xl border border-outline-variant/40 p-5">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-headline-sm font-headline-sm">Performance Trend</h2>
            <div id="rangeToggle" class="inline-flex rounded-lg bg-surface-container p-1 text-label-md">
              <button data-range="week"  class="px-3 h-8 rounded-md font-bold bg-surface-container-lowest text-on-surface shadow-sm">Week</button>
              <button data-range="month" class="px-3 h-8 rounded-md text-on-surface-variant">Month</button>
            </div>
          </div>
          <div class="relative h-72"><canvas id="performanceChart"></canvas></div>
        </section>

        <!-- Subject Mastery (dark) -->
        <section class="rounded-xl p-5 text-white relative overflow-hidden"
                 style="background: linear-gradient(160deg, #1d2640 0%, #0d1320 100%);">
          <!-- Decorative graduation cap behind the content — purely visual. -->
          <span class="material-symbols-outlined absolute pointer-events-none select-none"
                style="font-size:220px; right:-30px; bottom:-40px; color:rgba(255,255,255,0.06); transform: rotate(-12deg)">
            school
          </span>
          <div class="relative">
            <h2 class="text-headline-sm font-headline-sm mb-1">Subject Mastery</h2>
            <p class="text-label-md text-white/60 mb-5">Coverage across all topics</p>
            <div id="masteryList" class="space-y-4"></div>
            <a href="/practice_session" id="reviewWeakBtn"
               class="mt-6 w-full inline-flex items-center justify-center gap-2 h-11 rounded-lg bg-[#8ab4ff] text-[#0a1530] font-bold text-label-md hover:opacity-90 transition">
              <span class="material-symbols-outlined" style="font-size:20px">flag</span>
              Review Weak Topics
            </a>
          </div>
        </section>
      </div>

      <!-- Session History -->
      <section class="bg-surface-container-lowest rounded-xl border border-outline-variant/40 p-5">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-4">
          <h2 class="text-headline-sm font-headline-sm">Session History</h2>
          <div id="topicPills" class="flex gap-2 overflow-x-auto"></div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead class="text-label-md text-on-surface-variant">
              <tr class="border-b border-outline-variant/40">
                <th class="py-2 pr-4">Date</th>
                <th class="py-2 pr-4">Topic</th>
                <th class="py-2 pr-4">Score</th>
                <th class="py-2 pr-4">Time</th>
              </tr>
            </thead>
            <tbody id="historyRows" class="text-body-md"></tbody>
          </table>
        </div>
        <p id="emptyMsg" class="text-on-surface-variant text-label-md hidden mt-4">No practice sessions yet. <a href="/practice_session" class="text-primary font-bold">Start one</a>.</p>
      </section>
    </div>
  </main>

<script type="module">
  import { renderShell } from '/js/dist/layout.js';
  import { apiJson } from '/js/dist/auth.js';
  renderShell({ active: 'growth_history' });

  const TOPIC_NAMES = {
    'algebra': 'Algebra',
    'linear-equations': 'Linear Equations & Graphs',
    'fractions': 'Fractions, Decimals & Percents',
    'geometry': 'Geometry Basics',
    'stats': 'Statistics & Data',
    'civics-government': 'Civics & Government',
    'us-history': 'U.S. History',
    'economics': 'Economics',
    'geography': 'Geography',
    'world-history': 'World History',
    'reading-comprehension': 'Reading Comprehension',
    'grammar-and-usage': 'Grammar & Usage',
    'vocabulary-in-context': 'Vocabulary in Context',
    'analyzing-arguments': 'Analyzing Arguments',
    'writing-and-essay': 'Writing & Essay',
    'life-science': 'Life Science',
    'physical-science': 'Physical Science',
    'earth-space-science': 'Earth & Space Science',
    'scientific-method': 'Scientific Method',
    'data-interpretation': 'Scientific Data'
  };

  function deltaBadge(delta) {
    if (delta == null || !isFinite(delta) || delta === 0) return '';
    const positive = delta > 0;
    const arrow = positive ? 'arrow_upward' : 'arrow_downward';
    const cls = positive ? 'bg-[#1f3b27] text-[#9bdc8f]' : 'bg-[#4a1719] text-[#ff9d97]';
    return `<span class="inline-flex items-center gap-0.5 text-[11px] font-bold px-1.5 py-0.5 rounded ${cls}">
      <span class="material-symbols-outlined" style="font-size:12px">${arrow}</span>${Math.abs(delta)}%
    </span>`;
  }

  function statCard(label, value, suffix, icon, color, delta) {
    return `<div class="bg-surface-container-lowest rounded-xl p-5 border border-outline-variant/40">
      <div class="flex items-center justify-between mb-3">
        <span class="text-label-md text-on-surface-variant">${label}</span>
        <span class="material-symbols-outlined ${color || 'text-primary'}" style="font-size:22px">${icon}</span>
      </div>
      <div class="flex items-baseline gap-2">
        <span class="text-metric-display font-metric-display ${color || 'text-on-surface'}">${value}</span>
        <span class="text-body-md text-on-surface-variant">${suffix || ''}</span>
        ${deltaBadge(delta)}
      </div>
    </div>`;
  }

  function scoreClasses(pct) {
    if (pct >= 80) return ['bg-[#10b981]', 'text-[#10b981]'];
    if (pct >= 60) return ['bg-[#f59e0b]', 'text-[#f59e0b]'];
    return ['bg-error', 'text-error'];
  }

  function fmtDate(iso) {
    const d = new Date(iso.replace(' ', 'T') + (iso.endsWith('Z') ? '' : 'Z'));
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function fmtTime(sec) {
    const m = Math.floor(sec / 60); return m ? `${m} min` : `${sec}s`;
  }

  // ---- State ----
  let allSessions = [];
  let activeTopic = '';   // '' = all
  let activeRange = 'week';
  let chart = null;

  function renderRows() {
    const rows = activeTopic ? allSessions.filter(s => s.topic === activeTopic) : allSessions;
    const tbody = document.getElementById('historyRows');
    const empty = document.getElementById('emptyMsg');
    if (!rows.length) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    tbody.innerHTML = rows.map(r => {
      const [bar, txt] = scoreClasses(r.percent);
      return `<tr class="border-b border-outline-variant/30">
        <td class="py-3 pr-4 text-on-surface-variant">${fmtDate(r.createdAt)}</td>
        <td class="py-3 pr-4">${TOPIC_NAMES[r.topic] || r.topic}</td>
        <td class="py-3 pr-4">
          <div class="flex items-center gap-2">
            <div class="w-28 h-2 bg-surface-container rounded-full overflow-hidden"><div class="h-full ${bar}" style="width:${r.percent}%"></div></div>
            <span class="text-label-md font-bold ${txt}">${r.percent}%</span>
          </div>
        </td>
        <td class="py-3 pr-4 text-on-surface-variant">${fmtTime(r.timeSpent)}</td>
      </tr>`;
    }).join('');
  }

  function renderTopicPills() {
    // Highlight the user's most-practiced topics in addition to "All".
    const counts = {};
    for (const s of allSessions) counts[s.topic] = (counts[s.topic] || 0) + 1;
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([slug]) => slug);
    const items = [{ slug: '', label: 'All topics' }, ...top.map(slug => ({ slug, label: TOPIC_NAMES[slug] || slug }))];
    const el = document.getElementById('topicPills');
    el.innerHTML = items.map(i => {
      const active = i.slug === activeTopic;
      return `<button data-slug="${i.slug}" class="whitespace-nowrap h-9 px-4 rounded-full text-label-md font-label-md transition ${active ? 'bg-primary text-on-primary font-bold' : 'bg-surface-container text-on-surface-variant hover:bg-surface-container-high'}">${i.label}</button>`;
    }).join('');
    el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      activeTopic = b.dataset.slug;
      renderTopicPills();
      renderRows();
    }));
  }

  function bucketByRange(sessions, range) {
    // For 'week' return last 7 days; for 'month' return last 30 days (per-day avg).
    const days = range === 'week' ? 7 : 30;
    const buckets = new Map();
    const today = new Date(); today.setHours(0, 0, 0, 0);
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(today); d.setDate(today.getDate() - i);
      buckets.set(d.toISOString().slice(0, 10), { sum: 0, n: 0 });
    }
    for (const s of sessions) {
      const key = new Date(s.createdAt.replace(' ', 'T') + (s.createdAt.endsWith('Z') ? '' : 'Z'))
        .toISOString().slice(0, 10);
      if (buckets.has(key)) {
        const b = buckets.get(key); b.sum += s.percent; b.n += 1;
      }
    }
    const labels = [], data = [];
    for (const [k, v] of buckets) {
      const d = new Date(k);
      labels.push(d.toLocaleDateString(undefined, range === 'week' ? { weekday: 'short' } : { month: 'short', day: 'numeric' }));
      data.push(v.n ? Math.round(v.sum / v.n) : null);
    }
    return { labels, data };
  }

  function drawChart() {
    const { labels, data } = bucketByRange(allSessions, activeRange);
    if (chart) chart.destroy();
    const ctx = document.getElementById('performanceChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Score %',
          data,
          borderColor: '#005bbf',
          backgroundColor: 'rgba(26,115,232,0.12)',
          fill: true, tension: 0.35,
          pointBackgroundColor: '#005bbf',
          spanGaps: true
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } },
        plugins: { legend: { display: false } }
      }
    });
  }

  function wireRangeToggle() {
    const toggle = document.getElementById('rangeToggle');
    toggle.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
      activeRange = btn.dataset.range;
      toggle.querySelectorAll('button').forEach(b => {
        const on = b.dataset.range === activeRange;
        b.className = on
          ? 'px-3 h-8 rounded-md font-bold bg-surface-container-lowest text-on-surface shadow-sm'
          : 'px-3 h-8 rounded-md text-on-surface-variant';
      });
      drawChart();
    }));
  }

  function renderMastery(stats) {
    const items = Object.values(stats.bySubject || {}).map(sub => {
      const pct = Math.round(sub.percent || 0);
      const barColor = pct >= 80 ? '#9bdc8f' : pct >= 60 ? '#f5b76b' : '#ff9d97';
      return `<div>
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-label-md text-white/85 font-bold">${sub.name}</span>
          <span class="text-label-md text-white font-bold">${pct}%</span>
        </div>
        <div class="h-2 rounded-full bg-white/10 overflow-hidden">
          <div class="h-full rounded-full" style="width:${pct}%; background:${barColor}"></div>
        </div>
      </div>`;
    }).join('');
    document.getElementById('masteryList').innerHTML = items || `<p class="text-label-md text-white/60">Start a practice session to see mastery.</p>`;
  }

  function computeRecentDelta(sessions) {
    // Avg score of last 5 vs prior 5 — simple, honest trend signal.
    if (sessions.length < 4) return null;
    const last5 = sessions.slice(0, 5);
    const prev5 = sessions.slice(5, 10);
    if (!prev5.length) return null;
    const a = last5.reduce((s, x) => s + x.percent, 0) / last5.length;
    const b = prev5.reduce((s, x) => s + x.percent, 0) / prev5.length;
    return Math.round(a - b);
  }

  (async () => {
    try {
      const [stats, history] = await Promise.all([
        apiJson('/api/user/stats'),
        apiJson('/api/user/history?limit=100')
      ]);
      allSessions = history.sessions || [];

      const overallDelta = computeRecentDelta(allSessions);
      const overallColor = stats.overallScore >= 80 ? 'text-[#10b981]' : stats.overallScore >= 60 ? 'text-[#f59e0b]' : 'text-primary';
      document.getElementById('statsGrid').innerHTML = [
        statCard('Overall Progress', stats.overallScore, '%', 'trending_up', overallColor, overallDelta),
        statCard('Time Studied', stats.totalTimeMinutes, 'min', 'schedule'),
        statCard('Sessions', stats.sessionsCompleted, '', 'edit_square'),
        statCard('Current Streak', stats.streakDays, 'days', 'local_fire_department', 'text-[#f59e0b]')
      ].join('');

      renderMastery(stats);
      renderTopicPills();
      renderRows();
      wireRangeToggle();
      drawChart();
    } catch (e) {
      document.getElementById('statsGrid').innerHTML = `<div class="col-span-full text-error text-label-md">${e.message}</div>`;
    }
  })();
</script>
</body>
</html>
