<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>Growth History — GED Math Master</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}</style>
</head>
<body class="bg-background text-on-surface min-h-screen">
  <main class="md:pl-64 pt-16 md:pt-0 pb-20 md:pb-0">
    <div class="max-w-[1200px] mx-auto p-margin-mobile md:p-margin-desktop">
      <header class="mb-6">
        <h1 class="text-headline-lg font-headline-lg">Growth History</h1>
        <p class="text-body-md text-on-surface-variant mt-1">See how your performance trends over time.</p>
      </header>

      <section id="statsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-gutter mb-8"></section>

      <section class="bg-surface-container-lowest rounded-xl border border-outline-variant/40 p-5 mb-8">
        <h2 class="text-headline-sm font-headline-sm mb-3">Performance Trend</h2>
        <div class="relative h-72"><canvas id="performanceChart"></canvas></div>
      </section>

      <section class="bg-surface-container-lowest rounded-xl border border-outline-variant/40 p-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-headline-sm font-headline-sm">Session History</h2>
          <select id="topicFilter" class="h-9 px-3 rounded-lg ring-1 ring-outline-variant text-label-md bg-surface-container-lowest">
            <option value="">All topics</option>
          </select>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead class="text-label-md text-on-surface-variant">
              <tr class="border-b border-outline-variant/40">
                <th class="py-2 pr-4">Date</th>
                <th class="py-2 pr-4">Topic</th>
                <th class="py-2 pr-4">Score</th>
                <th class="py-2 pr-4">Time</th>
              </tr>
            </thead>
            <tbody id="historyRows" class="text-body-md"></tbody>
          </table>
        </div>
        <p id="emptyMsg" class="text-on-surface-variant text-label-md hidden mt-4">No practice sessions yet. <a href="/practice_session.html" class="text-primary font-bold">Start one</a>.</p>
      </section>
    </div>
  </main>

<script type="module">
  import { renderShell } from '/js/layout.js';
  import { apiJson } from '/js/auth.js';
  renderShell({ active: 'growth_history' });

  const TOPIC_NAMES = {
    'algebra': 'Algebra',
    'linear-equations': 'Linear Equations & Graphs',
    'fractions': 'Fractions, Decimals & Percents',
    'geometry': 'Geometry Basics',
    'stats': 'Statistics & Data'
  };

  function statCard(label, value, suffix, icon, color = 'text-primary') {
    return `<div class="bg-surface-container-lowest rounded-xl p-5 border border-outline-variant/40">
      <div class="flex items-center justify-between mb-3">
        <span class="text-label-md text-on-surface-variant">${label}</span>
        <span class="material-symbols-outlined ${color}" style="font-size:22px">${icon}</span>
      </div>
      <div class="flex items-baseline gap-1">
        <span class="text-metric-display font-metric-display ${color}">${value}</span>
        <span class="text-body-md text-on-surface-variant">${suffix || ''}</span>
      </div>
    </div>`;
  }

  function scoreClasses(pct) {
    if (pct >= 80) return ['bg-[#10b981]', 'text-[#10b981]'];
    if (pct >= 60) return ['bg-[#f59e0b]', 'text-[#f59e0b]'];
    return ['bg-error', 'text-error'];
  }

  function fmtDate(iso) {
    const d = new Date(iso.replace(' ', 'T') + (iso.endsWith('Z') ? '' : 'Z'));
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function fmtTime(sec) {
    const m = Math.floor(sec / 60); return m ? `${m} min` : `${sec}s`;
  }

  let allSessions = [];

  function renderRows(rows) {
    const tbody = document.getElementById('historyRows');
    if (!rows.length) {
      tbody.innerHTML = '';
      document.getElementById('emptyMsg').classList.remove('hidden');
      return;
    }
    document.getElementById('emptyMsg').classList.add('hidden');
    tbody.innerHTML = rows.map(r => {
      const [bar, txt] = scoreClasses(r.percent);
      return `<tr class="border-b border-outline-variant/30">
        <td class="py-3 pr-4 text-on-surface-variant">${fmtDate(r.createdAt)}</td>
        <td class="py-3 pr-4">${TOPIC_NAMES[r.topic] || r.topic}</td>
        <td class="py-3 pr-4">
          <div class="flex items-center gap-2">
            <div class="w-28 h-2 bg-surface-container rounded-full overflow-hidden"><div class="h-full ${bar}" style="width:${r.percent}%"></div></div>
            <span class="text-label-md font-bold ${txt}">${r.percent}%</span>
          </div>
        </td>
        <td class="py-3 pr-4 text-on-surface-variant">${fmtTime(r.timeSpent)}</td>
      </tr>`;
    }).join('');
  }

  function drawChart(sessions) {
    const ordered = [...sessions].reverse();
    const labels = ordered.map(s => fmtDate(s.createdAt));
    const data = ordered.map(s => s.percent);
    const ctx = document.getElementById('performanceChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Score %',
          data,
          borderColor: '#005bbf',
          backgroundColor: 'rgba(26,115,232,0.12)',
          fill: true, tension: 0.3, pointBackgroundColor: '#005bbf'
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } },
        plugins: { legend: { display: false } }
      }
    });
  }

  (async () => {
    try {
      const [stats, history] = await Promise.all([
        apiJson('/api/user/stats'),
        apiJson('/api/user/history?limit=50')
      ]);

      const overallColor = stats.overallScore >= 80 ? 'text-[#10b981]' : stats.overallScore >= 60 ? 'text-[#f59e0b]' : 'text-primary';
      document.getElementById('statsGrid').innerHTML = [
        statCard('Overall Progress', stats.overallScore, '%', 'trending_up', overallColor),
        statCard('Time Studied', stats.totalTimeMinutes, 'min', 'schedule'),
        statCard('Sessions', stats.sessionsCompleted, '', 'edit_square'),
        statCard('Current Streak', stats.streakDays, 'days', 'local_fire_department', 'text-[#f59e0b]')
      ].join('');

      allSessions = history.sessions || [];
      const filter = document.getElementById('topicFilter');
      const topics = [...new Set(allSessions.map(s => s.topic))];
      for (const t of topics) {
        const o = document.createElement('option');
        o.value = t; o.textContent = TOPIC_NAMES[t] || t;
        filter.appendChild(o);
      }
      filter.addEventListener('change', () => {
        const v = filter.value;
        renderRows(v ? allSessions.filter(s => s.topic === v) : allSessions);
      });

      renderRows(allSessions);
      if (allSessions.length) drawChart(allSessions);
    } catch (e) {
      document.getElementById('statsGrid').innerHTML = `<div class="col-span-full text-error text-label-md">${e.message}</div>`;
    }
  })();
</script>
</body>
</html>
