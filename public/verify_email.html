<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>Verify Email — GED Study Guide</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/theme.js"></script>
<script src="/js/theme-toggle-floating.js" defer></script>
<style>body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
  <main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-lg p-8 md:p-10">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-container/10 mb-4">
        <span class="material-symbols-outlined text-primary" style="font-size:28px">mark_email_read</span>
      </div>
      <h1 class="text-headline-md font-headline-md mb-2">Check your email</h1>
      <p class="text-body-md text-on-surface-variant">
        We sent a 6-digit code to <strong id="emailDisplay" class="text-on-surface">your email</strong>. It expires in 15 minutes.
      </p>
    </div>

    <div id="devCodeBox" class="hidden mb-4 p-3 rounded-lg bg-secondary-container/40 text-on-secondary-container text-label-md">
      <strong>Dev mode:</strong> SMTP not configured. Your code: <span id="devCode" class="font-mono font-bold tracking-widest"></span>
    </div>

    <div class="flex gap-2 justify-center mb-2" id="codeInputs">
      <input maxlength="1" type="text" inputmode="numeric" pattern="[0-9]" class="w-12 h-14 text-center text-headline-sm border border-outline-variant rounded-lg focus:border-2 focus:border-primary outline-none" />
      <input maxlength="1" type="text" inputmode="numeric" pattern="[0-9]" class="w-12 h-14 text-center text-headline-sm border border-outline-variant rounded-lg focus:border-2 focus:border-primary outline-none" />
      <input maxlength="1" type="text" inputmode="numeric" pattern="[0-9]" class="w-12 h-14 text-center text-headline-sm border border-outline-variant rounded-lg focus:border-2 focus:border-primary outline-none" />
      <input maxlength="1" type="text" inputmode="numeric" pattern="[0-9]" class="w-12 h-14 text-center text-headline-sm border border-outline-variant rounded-lg focus:border-2 focus:border-primary outline-none" />
      <input maxlength="1" type="text" inputmode="numeric" pattern="[0-9]" class="w-12 h-14 text-center text-headline-sm border border-outline-variant rounded-lg focus:border-2 focus:border-primary outline-none" />
      <input maxlength="1" type="text" inputmode="numeric" pattern="[0-9]" class="w-12 h-14 text-center text-headline-sm border border-outline-variant rounded-lg focus:border-2 focus:border-primary outline-none" />
    </div>

    <p id="errorMsg" class="text-error text-label-md text-center mb-3 hidden"></p>
    <p id="successMsg" class="text-[#047857] text-label-md text-center mb-3 hidden"></p>

    <button id="verifyBtn" class="w-full h-12 bg-primary text-on-primary rounded-lg font-bold text-label-md hover:opacity-90 disabled:opacity-60 mt-2">
      Verify Email
    </button>

    <p class="text-center text-label-md text-on-surface-variant mt-4">
      Didn't receive it?
      <button id="resendBtn" class="text-primary font-bold hover:underline">Resend code</button>
    </p>

    <p class="text-center text-label-md text-on-surface-variant mt-6">
      <a href="/privacy" target="_blank" class="hover:underline">Privacy Policy</a>
      &nbsp;·&nbsp;
      <a href="/terms" target="_blank" class="hover:underline">Terms of Service</a>
    </p>
  </main>

<script type="module">
  import { setSession } from '/js/auth.js';

  const $ = id => document.getElementById(id);
  const inputs = document.querySelectorAll('#codeInputs input');
  const email = sessionStorage.getItem('ged_pending_email');

  if (!email) { window.location.href = '/login'; }
  $('emailDisplay').textContent = email;

  function showError(m)   { $('successMsg').classList.add('hidden'); $('errorMsg').textContent = m; $('errorMsg').classList.remove('hidden'); }
  function showSuccess(m) { $('errorMsg').classList.add('hidden');   $('successMsg').textContent = m; $('successMsg').classList.remove('hidden'); }
  function clearMsgs()    { $('errorMsg').classList.add('hidden');   $('successMsg').classList.add('hidden'); }

  inputs.forEach((input, i) => {
    input.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g, '');
      if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && i > 0) inputs[i - 1].focus();
    });
    input.addEventListener('paste', (e) => {
      const text = (e.clipboardData?.getData('text') || '').replace(/\D/g, '').slice(0, 6);
      if (text.length >= 1) {
        e.preventDefault();
        for (let k = 0; k < text.length && i + k < inputs.length; k++) inputs[i + k].value = text[k];
        inputs[Math.min(i + text.length, inputs.length - 1)].focus();
      }
    });
  });

  // If create_account stashed a dev code, surface it (for local dev only).
  const stashedCode = sessionStorage.getItem('ged_dev_code');
  if (stashedCode) {
    $('devCode').textContent = stashedCode;
    $('devCodeBox').classList.remove('hidden');
    sessionStorage.removeItem('ged_dev_code');
  }

  async function submitCode() {
    clearMsgs();
    const code = [...inputs].map(i => i.value).join('');
    if (code.length < 6) return showError('Please enter all 6 digits.');
    $('verifyBtn').disabled = true;
    try {
      const res = await fetch('/api/auth/verify-email', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, code })
      });
      const data = await res.json();
      if (!res.ok) return showError(data.message);
      setSession(data);
      sessionStorage.removeItem('ged_pending_email');
      window.location.href = '/dashboard';
    } catch (e) { showError(e.message); }
    finally { $('verifyBtn').disabled = false; }
  }

  async function resendCode() {
    clearMsgs();
    try {
      const res = await fetch('/api/auth/resend-verification', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (!res.ok) return showError(data.message);
      showSuccess(data.message || 'A new code has been sent.');
      if (data.devCode) { $('devCode').textContent = data.devCode; $('devCodeBox').classList.remove('hidden'); }
      inputs.forEach(i => i.value = '');
      inputs[0].focus();
    } catch (e) { showError(e.message); }
  }

  $('verifyBtn').addEventListener('click', submitCode);
  $('resendBtn').addEventListener('click', resendCode);
  // Auto-submit when all 6 are filled
  inputs.forEach(inp => inp.addEventListener('input', () => {
    if ([...inputs].every(i => i.value)) submitCode();
  }));
  inputs[0].focus();
</script>
</body>
</html>
